name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      # java — для FreeMarker и Java-решений, g++ уже есть в образе.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e ".[dev]"
      # Кэш сборок тестов (tests/compile_cache.py) между прогонами: ключ записи —
      # исходник после препроцессора и версия g++, так что старый кэш не
      # мешает, а берётся самый свежий. Каталог d/ — только данные плагинов, без
      # lastfailed.
      - uses: actions/cache@v4
        with:
          path: .pytest_cache/d
          key: pytest-compiles-${{ runner.os }}-${{ github.sha }}
          restore-keys: pytest-compiles-${{ runner.os }}-
      # Integration-тесты выключены в pyproject.toml (addopts), ключей API здесь нет.
      # loadgroup — сборки образцов на одном процессе, см. test_example_templates.py.
      - run: pytest -q -n auto --dist loadgroup

problem_id: valid-spec
title:
  ru: "Кратчайшие пути"
  en: "Shortest paths"

statement_draft:
  legend_sketch: |
    There's a graph of cities and roads, find the shortest path between two
    given cities.
  formal_input_sketch: |
    Given an undirected weighted graph: N vertices, K edges, for each
    edge — a pair of vertices and a weight. Then a pair of vertices S and T.
  formal_output_sketch: |
    One number — the length of the shortest path from S to T. It's guaranteed that a path
    exists.
  indexing: "1-indexed"
  sample_examples:
    - input: |
        3 2
        1 2 5
        2 3 3
        1 3
      output: |
        8
      note_hint: "show that the path goes through an intermediate vertex"
  known_ambiguities:
    - "it isn't decided how to handle multiple edges between one pair of vertices"

constraints:
  intended_complexity: "O((N + K) log N)"
  complexity_reasoning: |
    Dijkstra's algorithm with a binary heap.
  variables:
    - name: "N"
      min: 1
      max: 100000
      description: "the number of vertices"
    - name: "K"
      min: 0
      max: "2*N"
      description: "the number of edges"
  special_guarantees:
    - "the graph is connected by definition"
  test_groups_hint:
    - name: "small"
      subset_of: null
      max_n: 10
  time_limit_seconds: 2.0
  memory_limit_mb: 256
  uncertain_points:
    - "not sure 10^5 edges are enough for a TL group without fast input"

generation:
  generator_ideas:
    - name: "gen_rand"
      params: ["n", "k"]
      purpose: "a random connected graph"
  specific_test_ideas:
    - "N = 1 (the minimal case)"
    - "N = N_max, maximal values"
  references:
    - "examples/array/prefix-sums/validator.cpp"
  script_style: "groups"

solutions:
  wanted_verdicts: ["ok", "wa", "tl"]
  languages: ["cpp"]
  algorithm_hint: |
    Dijkstra with a priority queue, O((N+K) log N).
  known_wrong_approaches:
    - "tl: O(N^2) without a heap — TLE on large N"

checker:
  standard: "ncmp"
  custom_needed: false
  custom_comparison_notes: null

# A synthetic test plan (format — templates/tests_plan_format.yaml) for
# fake model responses to the tests_plan step.
problem_id: p1
generators:
  - name: gen_rand
    status: confirmed
    params:
      - name: n
        type: int
        description: the number of elements
    input: null
    output: the whole test
    algorithm: |
      A random array of length n.
constants:
  - name: maxN
    value: 10^5
    description: n.max from constraints.yaml
tests:
  - description: Random maximal tests
    status: confirmed
    covers: []
    commands:
      - gen_rand -n=maxN
    repeat: null

problem_id: missing-intended-complexity
title:
  ru: "Кратчайшие пути"

statement_draft:
  legend_sketch: |
    Есть граф городов и дорог, нужно найти кратчайший путь между двумя
    заданными городами.
  formal_input_sketch: |
    Дан неориентированный взвешенный граф: N вершин, K рёбер.
  formal_output_sketch: |
    Одно число — длина кратчайшего пути.
  indexing: "1-indexed"
  sample_examples:
    - input: |
        3 2
        1 2 5
        2 3 3
        1 3
      output: |
        8

constraints:
  complexity_reasoning: |
    Алгоритм Дейкстры с бинарной кучей.
  variables:
    - name: "N"
      min: 1
      max: 100000
      description: "количество вершин"

generation:
  reuse_existing_generators: true
  script_style: "flat"

checker:
  standard: "ncmp"
  custom_needed: false

meta:
  status: "draft"

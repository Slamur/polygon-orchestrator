problem_id: interactive-spec
title:
  ru: "Угадай число"

statement_draft:
  legend_sketch: |
    The jury hid a number from 1 to N, it has to be guessed.
  formal_input_sketch: |
    Test: two numbers N and X — the bound and the hidden number.
  formal_output_sketch: |
    The final answer is the hidden number, see the protocol.
  indexing: "irrelevant"
  sample_examples:
    - input: |
        10 3
      note_hint: "show the answers < and >"
  interaction_sketch: |
    At the start the solution reads N. Query "? y" — the interactor answers "<", ">"
    or "=". At most 30 queries. The answer "! x", after it the solution
    terminates.

constraints:
  intended_complexity: "O(log N)"
  complexity_reasoning: |
    Binary search on the answer.
  variables:
    - name: "N"
      min: 1
      max: 1000000000
      description: "the bound"
  time_limit_seconds: 1.0
  memory_limit_mb: 256

generation:
  script_style: "flat"

checker:
  standard: "wcmp"
  custom_needed: false

interactor:
  behavior_notes: |
    Non-adaptive: X is taken from the test. More than 30 queries or a wrong
    final answer — WA. tout has the solution's final answer.

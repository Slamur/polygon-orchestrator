[project]
name = "polygon-orchestrator"
version = "0.1.0"
description = "Оркестратор генеративных шагов подготовки задачи для Polygon"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "Jinja2>=3,<4",
    "anthropic>=1,<2",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: бьёт в реальный Anthropic API (нужен ANTHROPIC_API_KEY), не запускается по умолчанию",
]
addopts = "-m 'not integration'"

[tool.setuptools.packages.find]
include = ["orchestrator*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
orchestrator = "orchestrator.cli:main"
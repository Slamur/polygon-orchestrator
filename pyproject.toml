[project]
name = "polygon-orchestrator"
version = "0.1.0"
description = "Оркестратор генеративных шагов подготовки задачи для Polygon"
requires-python = ">=3.10"
dependencies = [
    "argcomplete>=3,<4",
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "Jinja2>=3,<4",
    "anthropic>=1,<2",
    "python-dotenv>=1,<2",
    "requests>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.17,<0.18",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: бьёт в реальный внешний API (Anthropic и/или Polygon; нужны ANTHROPIC_API_KEY и/или POLYGON_API_KEY/POLYGON_API_SECRET), не запускается по умолчанию",
]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py310"
# Ширина, на которой у кода, написанного до ruff format, меньше всего правок.
line-length = 100
# examples/ и templates/ — материалы задач (образцы для модели, шаблоны автора),
# а не код оркестратора; problems/ и drafts/ — задачи автора.
extend-exclude = ["problems", "drafts", "outputs", "examples", "templates"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade. Длину строк не проверяем:
# код переносит ruff format, а то, что он не переносит, — в основном русский
# текст комментариев и строк сообщений.
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.setuptools.packages.find]
include = ["orchestrator*"]

[tool.setuptools.package-data]
orchestrator = ["checks/*.java"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
orchestrator = "orchestrator.cli:main"

[project]
name = "polygon-orchestrator"
version = "0.1.0"
description = "An orchestrator of generative steps for preparing a problem for Polygon"
requires-python = ">=3.10"
dependencies = [
    "argcomplete>=3,<4",
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "Jinja2>=3,<4",
    "anthropic>=1,<2",
    "python-dotenv>=1,<2",
    "requests>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-xdist>=3.6",
    "ruff>=0.17,<0.18",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: hits a real external API (Anthropic and/or Polygon; needs ANTHROPIC_API_KEY and/or POLYGON_API_KEY/POLYGON_API_SECRET), not run by default",
    "slow: builds or runs C++/Java (g++, java, FreeMarker); pytest --fast skips them (tests/conftest.py), CI runs all",
]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py310"
# The width at which code written before ruff format needs the fewest edits.
line-length = 100
# examples/ and templates/ are problem materials (samples for the model, the author's templates),
# not orchestrator code; problems/ and drafts/ are the author's problems.
extend-exclude = ["problems", "drafts", "outputs", "examples", "templates"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade. Line length isn't checked:
# ruff format wraps code, and what it doesn't wrap is mostly the text of
# comments and message strings.
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.setuptools.packages.find]
include = ["orchestrator*"]

[tool.setuptools.package-data]
orchestrator = ["checks/*.java"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
orchestrator = "orchestrator.cli:main"

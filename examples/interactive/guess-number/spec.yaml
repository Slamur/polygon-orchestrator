# Черновик спека задачи. Создан командой `orchestrator <задача> init`
# из templates/spec_template.yaml.
#
# Полный формат с примерами и пояснениями — docs/SPEC_FORMAT.md.

problem_id: interactive--guess-number # [required] заполняется командой init: имя каталога задачи (в examples/ — путь через "--")
title:
  ru: "Угадай число"
  en: "Guess the number"            # PROPOSED, REVIEW ME: перевод заголовка черновика
references: []                       # [optional] образцы для всех шагов: каталоги задач или файлы, например
                                     #   - "examples/array/prefix-sums"

# ---------------------------------------------------------------------------
# 1. ЧЕРНОВИК УСЛОВИЯ — шаг statement_draft
# ---------------------------------------------------------------------------
statement_draft:
  legend_sketch: |
    Интерактивная задача.

    Загадано целое число в промежутке [1; N] — необходимо его угадать.

    Программа может делать запрос "? X", где X — целое число из промежутка
    [1; N]. На запрос можно получить один из трёх ответов:
      - "<": загаданное число меньше X;
      - ">": загаданное число больше X;
      - "=": загаданное число равно X.

    Программа может сделать не более 10 запросов.

    Если программа получает ответ "=", то она должна завершиться (тест
    считается пройденным).

    Если программа делает больше 10 запросов — то она автоматически
    получает вердикт "неправильный ответ".
  formal_input_sketch: |              # PROPOSED, REVIEW ME: формат файла теста (скрытые данные для интерактора) в черновике не задан; выведен из модели задачи и из идей генераторов ("N — степень двойки + delta", "загадано 1 или N")
    Файл теста (его читает интерактор, решение этих данных целиком не видит):

    В первой строке одно целое число N — верхняя граница диапазона.
    Во второй строке одно целое число X — загаданное число, 1 <= X <= N.
  formal_output_sketch: |             # PROPOSED, REVIEW ME: отдельного итогового вывода в черновике нет — решение лишь задаёт запросы и завершается после "="
    Отдельного ответа в конце выводить не нужно: весь вывод решения — это
    запросы вида "? X". Решение считается давшим верный ответ, если оно
    получило ответ "=" (то есть назвало загаданное число), сделав при этом
    не более 10 запросов.
  indexing: "irrelevant"              # PROPOSED, REVIEW ME: массивов и индексации в задаче нет, числа даны по значению
  sample_examples:
    - input: |                        # PROPOSED, REVIEW ME: примера в черновике нет; небольшой тест N = 10, загадано 7
        10
        7
      output: |                       # PROPOSED, REVIEW ME: реплики решения — диалог бинпоиска, посчитан вручную: mid = 5 (">"), mid = 8 ("<"), mid = 6 (">"), mid = 7 ("="), 4 запроса
        ? 5
        ? 8
        ? 6
        ? 7
      note_hint: |
        Показать диалог целиком: на "? 5" интерактор отвечает ">"
        (7 > 5), на "? 8" — "<", на "? 6" — ">", на "? 7" — "=", после
        чего решение завершается. Подчеркнуть, что загаданное число 7
        решению заранее не известно, оно видит только N = 10 и ответы на
        свои запросы, и что сделано 4 запроса из разрешённых 10.
    - input: |                        # SUGGESTION: минимальный случай N = 1 — показать, что запрос всё равно обязателен
        1
        1
      output: |                       # PROPOSED, REVIEW ME: единственный возможный запрос при N = 1
        ? 1
      note_hint: "При N = 1 загадано единственное возможное число, но решение всё равно обязано задать запрос \"? 1\" и получить ответ \"=\""
  known_ambiguities:
    - "не решено, что делать, если решение завершается, не получив ответ \"=\" — принято считать это неправильным ответом"   # PROPOSED, REVIEW ME: в черновике описан только случай получения "=" и случай превышения лимита
    - "не решено, проверяются ли лишние запросы после ответа \"=\" — принято, что интерактор завершается сразу после \"=\" (тест считается пройденным, как написано в черновике), поэтому дальнейшее поведение решения не проверяется"   # PROPOSED, REVIEW ME: следствие формулировки "тест считается пройденным"
  preserve_legend_verbatim: false
  interaction_sketch: |
    В начале взаимодействия решение читает из стандартного ввода одно
    целое число N — верхнюю границу диапазона.                       # PROPOSED, REVIEW ME: в черновике сказано, что X выбирается из [1; N], значит N решению сообщается; точный формат (одно число в первой строке) предложен

    Далее решение задаёт запросы. Запрос — строка "? X", где X — целое
    число из промежутка [1; N]. В ответ решение читает одну строку:
      - "<" — загаданное число меньше X;
      - ">" — загаданное число больше X;
      - "=" — загаданное число равно X.

    Разрешено не более 10 запросов. Если решение делает больше 10
    запросов, оно получает вердикт "неправильный ответ".

    Получив ответ "=", решение должно завершиться — тест считается
    пройденным. Отдельного итогового вывода нет.

    Запрос, выходящий за [1; N] или не соответствующий формату, а также
    завершение решения без полученного ответа "=" считаются неправильным
    ответом.                                                          # PROPOSED, REVIEW ME: реакция на некорректный запрос и на завершение без "=" в черновике не описана

    После каждого запроса нужно сбрасывать буфер вывода (fflush(stdout) /
    cout << endl / System.out.flush() / sys.stdout.flush()).          # PROPOSED, REVIEW ME: стандартное требование интерактивных задач
  references: []

# ---------------------------------------------------------------------------
# 2. ОГРАНИЧЕНИЯ — шаг constraints_pick (+ валидатор)
# ---------------------------------------------------------------------------
constraints:
  intended_complexity: "O(log N) запросов"   # PROPOSED, REVIEW ME: асимптотика в черновике не названа, но лимит 10 запросов при N <= 10^3 — это ровно ceil(log2(1000)) = 10, то есть предполагается бинарный поиск
  complexity_reasoning: |                    # PROPOSED, REVIEW ME: обоснование выведено из лимита запросов, заданного автором
    Бинарный поиск по диапазону: поддерживается отрезок [lo, hi]
    кандидатов, запрашивается mid = (lo + hi) / 2; ответ "=" завершает
    работу, "<" сужает отрезок до [lo, mid - 1], ">" — до [mid + 1, hi].
    Каждый запрос уменьшает число кандидатов примерно вдвое, поэтому
    хватает ceil(log2(N)) <= ceil(log2(1000)) = 10 запросов — ровно
    авторский лимит. Лимит плотный: сужение отрезка до единственного
    кандидата с отдельным финальным запросом требует уже 11 запросов при
    N = 1000, то есть ответ "=" обязательно нужно использовать на каждом
    шаге. Время работы решения вне взаимодействия — O(1) на запрос.
  variables:
    - name: "N"
      min: 1
      max: 1000
      description: "верхняя граница диапазона: загаданное число лежит в [1; N]"
    - name: "X"
      min: 1
      max: "N"
      description: "загаданное число (скрытые данные теста)"   # PROPOSED, REVIEW ME: переменная файла теста, следует из предложенного formal_input_sketch
    - name: "Q"
      min: 0
      max: 10
      description: "количество запросов, которые разрешено сделать решению"
  special_guarantees:
    - "лимит 10 запросов не зависит от N"
    - "загаданное число X фиксировано до начала взаимодействия и не меняется (интерактор не адаптивный)"   # PROPOSED, REVIEW ME: следует из того, что загаданное число задаётся генератором в файле теста
  test_groups_hint: []
  test_groups_needed: false
  time_limit_seconds: 1               # PROPOSED, REVIEW ME: работы вне взаимодействия почти нет (до 10 запросов), 1 с с запасом
  memory_limit_mb: 256
  uncertain_points:
    - "при N = 1 загаданное число известно заранее, но решение всё равно обязано задать запрос \"? 1\", чтобы получить \"=\" — стоит проверить, что это ожидаемое поведение"   # PROPOSED, REVIEW ME: краевой случай, в черновике не разобран
  references: []

# ---------------------------------------------------------------------------
# 3. ГЕНЕРАТОРЫ И TEST-SCRIPT — шаг generators_and_script
# ---------------------------------------------------------------------------
generation:
  generator_ideas:
    - name: "gen_pow2_delta"
      params: ["p", "delta", "x"]
      purpose: |
        N = 2^p + delta, delta из {-1, 0, 1}; загаданное число X задаётся
        параметром x. Падает, если полученное N выходит за допустимый
        диапазон или x не лежит в [1, N].                               # PROPOSED, REVIEW ME: авторская идея "N — степень двойки + delta", оформлена как генератор с параметрами
    - name: "gen_edge_x"
      params: ["n", "which"]
      purpose: |
        Загаданное число на краю диапазона: which = 1 — X = 1,
        which = 2 — X = N.                                              # PROPOSED, REVIEW ME: авторская идея "загадано 1 или N", оформлена как генератор
    - name: "gen_rand"
      params: ["minN", "maxN"]
      purpose: "случайное N из [minN, maxN] и случайное загаданное X из [1, N]"   # SUGGESTION: случайные тесты в спеке не упомянуты, но нужны для общего покрытия
    - name: "gen_fixed"
      params: ["n", "x"]
      purpose: "тест с явно заданными N и X — для перечисления конкретных краевых случаев"   # SUGGESTION: удобно для ручных тестов из specific_test_ideas
    - name: "gen_worst_x"
      params: ["n"]
      purpose: |
        N задано, X выбирается как загаданное число, на котором
        стандартный бинпоиск делает максимальное число запросов (симуляция
        бинпоиска для всех X из [1, N] и выбор X с максимальной длиной
        диалога).                                                        # SUGGESTION: такой тест ловит решения, которым нужен 11-й запрос
  specific_test_ideas:
    - "N = степень двойки плюс delta (delta из {-1, 0, 1}) для всех p, при которых N попадает в [1, 1000]"
    - "загадано X = 1 и X = N (для N = 1000 и для N — степеней двойки + delta)"
    - "N = 1 (единственное возможное загаданное число)"            # SUGGESTION: минимальный краевой случай
    - "N = 1000 (максимум), загаданные числа 1, 2, 500, 501, 512, 513, 999, 1000 и несколько случайных"   # SUGGESTION: максимум N с краевыми и серединными X
    - "все пары (N, X) для N от 1 до 8 и всех X из [1, N]"         # SUGGESTION: полный перебор маленьких случаев
    - "худшее загаданное число для N = 1000 и для N = 1000 - 1, 512, 513 — диалог ровно из 10 запросов, ловит решения, которым нужен 11-й запрос"   # SUGGESTION: плотность лимита запросов
    - "случайные N из [1, 1000] со случайными загаданными X"        # SUGGESTION: общий фон
  script_style: "flat"                # PROPOSED, REVIEW ME: групп тестов автор не просил, тестов немного
  references: []

# ---------------------------------------------------------------------------
# 4. ЧЕРНОВИКИ РЕШЕНИЙ — шаг solutions_draft
# ---------------------------------------------------------------------------
solutions:
  wanted_verdicts: ["ok", "wa", "tl"]   # PROPOSED, REVIEW ME: решений автор не заказывал; нужен эталон, неверные решения и зависание без flush
  languages: ["cpp", "java", "py"]      # PROPOSED, REVIEW ME: стандартный набор языков
  algorithm_hint: |                     # PROPOSED, REVIEW ME: алгоритм в черновике не описан, выведен из лимита 10 запросов при N <= 10^3
    Прочитать N. Поддерживать отрезок кандидатов [lo, hi], изначально
    [1, N]. Пока lo <= hi: спросить "? mid", где mid = (lo + hi) / 2;
    при ответе "=" завершиться, при "<" положить hi = mid - 1, при ">" —
    lo = mid + 1. Ответ "=" обязательно использовать сразу (а не сужать
    отрезок до одного элемента и спрашивать его отдельно), иначе при
    N = 1000 может понадобиться 11-й запрос. После каждого запроса —
    сброс буфера вывода.
  alternative_approaches:
    - "рекурсивный бинпоиск по отрезку [lo, hi] вместо цикла"           # SUGGESTION: та же идея в другой реализации
    - "заранее построенное идеальное бинарное дерево поиска над [1, N] и спуск по нему в соответствии с ответами"   # SUGGESTION: другой верный способ уложиться в 10 запросов
  known_wrong_approaches:
    - "wa: линейный перебор X = 1, 2, 3, ... — больше 10 запросов уже при N = 12"   # SUGGESTION: самая вероятная ошибка участников
    - "wa: бинпоиск, сужающий отрезок до единственного кандидата и только потом задающий финальный запрос (ответ \"=\" на промежуточных запросах игнорируется) — при N = 1000 в худшем случае 11 запросов"   # SUGGESTION: ловится тестами с худшим X и N = степень двойки + delta
    - "wa: перепутаны ответы \"<\" и \">\" (отрезок сужается в противоположную сторону)"   # SUGGESTION: типичная ошибка в интерактивном бинпоиске
    - "wa: бинпоиск по отрезку [2, N - 1] (или [1, N - 1]) — не находит загаданные числа на краях диапазона"   # SUGGESTION: ловится тестами "загадано 1 или N"
    - "wa: off-by-one при сужении (hi = mid вместо hi = mid - 1 вместе с lo = mid + 1) — часть кандидатов перепроверяется и лимит запросов превышается"   # SUGGESTION: частая ошибка границ
    - "tl (cpp/java/py): верный бинпоиск без сброса буфера вывода — интерактор не получает запрос, взаимодействие зависает"   # SUGGESTION: классическая ошибка в интерактивных задачах
  references: []

# ---------------------------------------------------------------------------
# 5. ЧЕКЕР — шаг checker_draft (только при custom_needed: true)
# ---------------------------------------------------------------------------
checker:
  standard: "wcmp"                    # PROPOSED, REVIEW ME: всю проверку делает интерактор, в tout он пишет угаданное число — достаточно сравнения токенов
  custom_needed: false                # PROPOSED, REVIEW ME: отдельного ответа участник не выводит, нестандартного сравнения не требуется
  custom_comparison_notes: null
  references: []

# ---------------------------------------------------------------------------
# 6. ИНТЕРАКТОР — шаг interactor_draft (только для интерактивной задачи)
# ---------------------------------------------------------------------------
interactor:
  behavior_notes: |                   # PROPOSED, REVIEW ME: поведение интерактора в черновике не описано — восстановлено из правил взаимодействия (лимит 10 запросов, завершение по "=")
    Интерактор читает из файла теста N и загаданное число X и выводит
    решению N. Интерактор не адаптивный: X фиксировано файлом теста.

    Далее читает запросы решения. Корректный запрос — символ "?" и целое
    число X_q, причём 1 <= X_q <= N. На запрос интерактор отвечает:
      - "<", если X < X_q;
      - ">", если X > X_q;
      - "=", если X = X_q.

    Счётчик запросов: если решение делает 11-й запрос — вердикт
    "неправильный ответ" (_wa, "превышен лимит запросов: больше 10").

    Ответив "=", интерактор записывает в tout загаданное число X,
    завершается с _ok (тест пройден) и дальнейшие запросы решения не
    проверяет.

    Ошибки решения (все — _wa):
      - некорректный формат запроса (нет "?", не целое число);
      - X_q вне [1, N];
      - больше 10 запросов;
      - решение завершилось (конец потока), не получив ответ "=".

    В tout интерактор пишет одно число — угаданное решением значение
    (оно же X); чекер wcmp сравнивает его с tout эталонного прогона.
  references: []

problem_id: interactive--guess-number
intended_complexity: "O(log N) запросов"
complexity_reasoning: |
  Бинарный поиск по диапазону: поддерживается отрезок [lo, hi]
  кандидатов, запрашивается mid = (lo + hi) / 2; ответ "=" завершает
  работу, "<" сужает отрезок до [lo, mid - 1], ">" — до [mid + 1, hi].
  Каждый запрос уменьшает число кандидатов примерно вдвое, поэтому
  хватает ceil(log2(N)) <= ceil(log2(1000)) = 10 запросов — ровно
  авторский лимит. Лимит плотный: сужение отрезка до единственного
  кандидата с отдельным финальным запросом требует уже 11 запросов при
  N = 1000, то есть ответ "=" обязательно нужно использовать на каждом
  шаге. Время работы решения вне взаимодействия — O(1) на запрос.

variables:
  - name: "N"
    min: 1
    max: 1000
    description: "верхняя граница диапазона: загаданное число лежит в [1; N]"
    status: confirmed
  - name: "X"
    min: 1
    max: "N"              
    description: "загаданное число (скрытые данные теста), 1 <= X <= N"
    status: confirmed
  - name: "Q"
    min: 0
    max: 10
    description: "лимит запросов для решения; константа условия, во входном файле не присутствует"
    status: confirmed

limits:
  time_limit_seconds: 1
  memory_limit_mb: 256
  status: confirmed
  rationale: |
    TL и ML заданы автором явно (1 секунда, 256 Мб) и используются как есть.
    Согласованность: при N <= 1000 решение делает не более 10 запросов и
    O(1) работы на запрос, то есть вычислений порядка десятков операций;
    всё время уходит на обмен строками с интерактором, 1 секунда с большим
    запасом покрывает это на C++/Java (эталон укладывается заведомо быстрее
    0.5 * TL). Память: решению нужны лишь несколько переменных, 256 Мб
    (минимально рекомендуемая кратность) берётся как значение автора.

validator:
  constants:
    - name: "N"
      cpp_type: int
      min: 1
      max: 1000
    - name: "X"
      cpp_type: int
      min: 1
      max: 1000            # в валидаторе верхняя граница подставляется как прочитанное N
    - name: "Q"
      cpp_type: int
      min: 0
      max: 10              # константа условия; во входном файле токена Q нет, поэтому не читается
  checks:
    - "первая строка: одно целое N, затем readEoln"
    - "вторая строка: одно целое X, прочитанное как readInt(minX, N, \"X\") — тем самым проверяется гарантия 1 <= X <= N; затем readEoln"
    - "после второй строки — readEof: лишних данных в конце файла нет"
    - "гарантия 'лимит 10 запросов не зависит от N': Q — константа условия maxQ = 10, во входном файле не хранится, поэтому во входных данных проверять нечего (константа объявлена в валидаторе)"
    - "гарантия 'X фиксировано и интерактор не адаптивный': обеспечивается форматом файла — в тесте ровно один токен X, записанный до начала взаимодействия, и после него readEof запрещает любые дополнительные (альтернативные) значения"

problem_id: interactive--guess-number
intended_complexity: "O(log N) queries"
complexity_reasoning: |
  A binary search over the range: a segment [lo, hi] of candidates
  is maintained, mid = (lo + hi) / 2 is queried; the answer "=" ends
  the work, "<" narrows the segment to [lo, mid - 1], ">" — to [mid + 1, hi].
  Each query halves the number of candidates approximately, so
  ceil(log2(N)) <= ceil(log2(1000)) = 10 queries are enough — exactly
  the author's limit. The limit is tight: on the worst X with N = 1000 exactly
  10 queries are needed. Binary search variants with a separate final query and with
  hi = mid instead of hi = mid - 1 fit into it (checked over all N and X).
  The solution's running time outside the interaction — O(1) per query.

variables:
  - name: "N"
    min: 1
    max: 1000
    description: "the upper bound of the range: the hidden number lies in [1; N]"
    status: confirmed
  - name: "X"
    min: 1
    max: "N"
    description: "the hidden number (the test's hidden data), 1 <= X <= N"
    status: confirmed
  - name: "Q"
    min: 0
    max: 10
    description: "the query limit for the solution; a statement constant, not present in the input file"
    status: confirmed

limits:
  time_limit_seconds: 1
  memory_limit_mb: 256
  status: confirmed
  rationale: |
    TL and ML are set by the author explicitly (1 second, 256 MB) and are used as is.
    Consistency: with N <= 1000 the solution makes at most 10 queries and
    O(1) work per query, that is, computations of the order of tens of operations;
    all the time goes to exchanging lines with the interactor, 1 second covers it with a large
    margin in C++/Java (the reference fits certainly faster than
    0.5 * TL). Memory: the solution needs only a few variables, 256 MB
    (the minimal recommended multiple) is taken as the author's value.

validator:
  constants:
    - name: "N"
      cpp_type: int
      min: 1
      max: 1000
    - name: "X"
      cpp_type: int
      min: 1
      max: "N"
    - name: "Q"
      cpp_type: int
      min: 0
      max: 10              # a statement constant; there's no Q token in the input file, so it isn't read
  checks:
    - "the first line: one integer N, then readEoln"
    - "the second line: one integer X, read as readInt(minX, N, \"X\") — this checks the guarantee 1 <= X <= N; then readEoln"
    - "after the second line — readEof: there's no extra data at the end of the file"
    - "the guarantee 'the limit of 10 queries doesn't depend on N': Q is the statement constant maxQ = 10, it isn't stored in the input file, so there's nothing to check in the input data (the constant is declared in the validator)"
    - "the guarantee 'X is fixed and the interactor isn't adaptive': ensured by the file format — the test has exactly one token X, written before the interaction starts, and readEof after it forbids any additional (alternative) values"

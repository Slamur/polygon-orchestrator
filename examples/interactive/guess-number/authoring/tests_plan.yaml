problem_id: interactive--guess-number

# The interactor reads the test: N on the first line, the hidden X on the second.
generators:
  - name: gen_fixed
    status: confirmed
    params:
      - name: n
        type: int
        description: the upper bound of the range, 1 <= n <= 1000
      - name: x
        type: int
        description: the hidden number, 1 <= x <= n
    input: null
    output: the whole test — N and X
    algorithm: |
      Prints n and x as is. Fails if n is outside [1, 1000] or x is outside [1, n].

  - name: gen_pow2_delta
    status: confirmed
    params:
      - name: p
        type: int
        description: the exponent of the power of two
      - name: delta
        type: int
        description: the shift of N from 2^p, from {-1, 0, 1}
      - name: x
        type: int
        description: the hidden number, 1 <= x <= N
    input: null
    output: the whole test — N and X
    algorithm: |
      N = 2^p + delta (in a 64-bit type). Fails if delta is outside {-1, 0, 1},
      N is outside [1, 1000] or x is outside [1, N].

  - name: gen_rand
    status: confirmed
    params:
      - name: minN
        type: int
        description: the smallest N
      - name: maxN
        type: int
        description: the largest N
    input: null
    output: the whole test — N and X
    algorithm: |
      N is a random one from [minN, maxN], X is a random one from [1, N]. Fails unless
      1 <= minN <= maxN <= 1000.

  - name: gen_worst_x
    status: confirmed
    params:
      - name: n
        type: int
        description: the upper bound of the range, 1 <= n <= 1000
    input: null
    output: the whole test — N and X
    algorithm: |
      For each X from [1, n] the standard binary search is simulated (lo = 1,
      hi = n, mid = (lo + hi) / 2, query mid, stop at mid = X, otherwise
      lo = mid + 1 or hi = mid - 1) and the number of queries is counted; X is
      a random one among those giving the largest number of queries. Fails if n is outside
      [1, 1000].

constants:
  - name: minN
    value: "1"
    description: N.min from constraints.yaml
  - name: maxN
    value: "1000"
    description: N.max from constraints.yaml
  - name: minX
    value: "1"
    description: X.min from constraints.yaml
  - name: maxExhaustiveN
    value: "8"
    description: the largest N with a full enumeration of pairs (N, X) from specific_test_ideas[4]
  - name: maxXList
    value: "[1, 2, 500, 501, 512, 513, 999, 1000]"
    description: the hidden numbers with N = maxN from specific_test_ideas[3]
  - name: worstNs
    value: "[maxN, maxN - 1, 512, 513]"
    description: N for the worst hidden number from specific_test_ideas[5]
  - name: randBands
    value: "[[minN, maxN], [minN, maxN / 2], [maxN / 2, maxN], [minN, 20], [maxN - 20, maxN]]"
    description: different ranges of N for random tests — so that the script lines don't match

tests:
  - description: All pairs (N, X) for N from 1 to 8
    status: confirmed
    covers:
      - specific_test_ideas[2]
      - specific_test_ideas[4]
      - known_wrong_approaches[1]
      - known_wrong_approaches[2]
      - known_wrong_approaches[3]
    commands:
      - gen_fixed -n=n -x=x
    repeat: n = minN..maxExhaustiveN, x = minX..n

  - description: N = 2^p + delta for all p at which N is in (maxExhaustiveN, maxN], X = 1 and X = N
    status: confirmed
    covers:
      - specific_test_ideas[0]
      - specific_test_ideas[1]
      - known_wrong_approaches[2]
    commands:
      - gen_pow2_delta -p=p -delta=delta -x=minX
      - gen_pow2_delta -p=p -delta=delta -x=n
    repeat: |
      p = 0..10, delta over [-1, 0, 1], n = 2^p + delta; only n in
      (maxExhaustiveN, maxN] — smaller n would give the same tests as the full
      enumeration above

  - description: N = maxN with explicitly given boundary and arbitrary X
    status: confirmed
    covers:
      - specific_test_ideas[1]
      - specific_test_ideas[3]
    commands:
      - gen_fixed -n=maxN -x=x
    repeat: x over maxXList

  - description: N near maxN with several random X
    status: proposed
    covers:
      - specific_test_ideas[3]
    commands:
      - gen_rand -minN=maxN -maxN=maxN
      - gen_rand -minN=maxN-9 -maxN=maxN
      - gen_rand -minN=maxN-49 -maxN=maxN
    repeat: null
    rationale: |
      "Several random" X with N = 1000 — different ranges of N, so that
      the script lines don't match (identical lines give identical tests).

  - description: The worst X — exactly the maximum of queries, catches solutions that need an 11th query
    status: confirmed
    covers:
      - specific_test_ideas[5]
      - known_wrong_approaches[0]
    commands:
      - gen_worst_x -n=n
    repeat: n over worstNs

  - description: Random N over the whole range with random X, several different ranges
    status: proposed
    covers:
      - specific_test_ideas[6]
    commands:
      - gen_rand -minN=band0 -maxN=band1
    repeat: "[band0, band1] over randBands"
    rationale: |
      Different ranges instead of repeating one call — identical script lines
      would give identical tests.

  - description: The bound slightly below the threshold N = 512
    status: suggestion
    covers: []
    commands:
      - gen_worst_x -n=511
    repeat: null
    rationale: |
      The gen_worst_x tests above check N where the correct algorithm needs exactly
      10 queries; N = 511 is the symmetric case one step below the threshold (9
      queries): a solution with a mistake in computing the query budget in the other
      direction would pass all of the author's tests.

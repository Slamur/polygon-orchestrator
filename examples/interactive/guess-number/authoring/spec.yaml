# A problem spec draft. Created by the `orchestrator <problem> init` command
# from templates/spec_template.yaml.
#
# The full format with examples and explanations — docs/SPEC_FORMAT.md.

problem_id: interactive--guess-number
title:
  ru: "Угадай число"
  en: "Guess the number"
references: []

# ---------------------------------------------------------------------------
# 1. STATEMENT DRAFT — the statement_draft step
# ---------------------------------------------------------------------------
statement_draft:
  legend_sketch: |
    An interactive problem.

    An integer in the range [1; N] is hidden — it has to be guessed.

    The program can make a query "? X", where X is an integer from the range
    [1; N]. A query can get one of three answers:
      - "<": the hidden number is less than X;
      - ">": the hidden number is greater than X;
      - "=": the hidden number is equal to X.

    The program can make at most 10 queries.

    If the program gets the answer "=", it must terminate (the test
    is considered passed).

    If the program makes more than 10 queries — it automatically
    gets the "wrong answer" verdict.

    If the program terminates without having got the answer "=" — it automatically
    gets the "wrong answer" verdict.
  formal_input_sketch: |
    The test file (the interactor reads it, the solution doesn't see this data in full):

    The first line has one integer N (1 <= N <= 1000) — the upper bound of the range.
    The second line has one integer X — the hidden number, 1 <= X <= N.
  formal_output_sketch: |
    There's no need to print a separate answer at the end: the whole output of the solution is
    queries of the form "? X". The solution is considered to have given a correct answer if it
    got the answer "=" (that is, named the hidden number), having made
    at most 10 queries.
  indexing: "irrelevant"
  sample_examples:
    - input: |
        10
        7
      output: |
        ? 5
        ? 8
        ? 6
        ? 7
      note_hint: |
        Show the whole dialogue: to "? 5" the interactor answers ">"
        (7 > 5), to "? 8" — "<", to "? 6" — ">", to "? 7" — "=", after
        which the solution terminates. Stress that the hidden number 7
        isn't known to the solution in advance, it sees only N = 10 and the answers to
        its queries, and that 4 queries out of the allowed 10 were made.
    - input: |
        1
        1
      output: |
        ? 1
      note_hint: "With N = 1 the only possible number is hidden, but the solution still must ask the query \"? 1\" and get the answer \"=\""
  preserve_legend_verbatim: false
  interaction_sketch: |
    At the start of the interaction the solution reads from standard input one
    integer N — the upper bound of the range.

    Then the solution asks queries. A query is a line "? X", where X is an integer
    from the range [1; N]. In response the solution reads one line:
      - "<" — the hidden number is less than X;
      - ">" — the hidden number is greater than X;
      - "=" — the hidden number is equal to X.

    At most 10 queries are allowed. If the solution makes more than 10
    queries, it gets the "wrong answer" verdict.

    Having got the answer "=", the solution must terminate — the test is considered
    passed. There's no separate final output.

    A query outside [1; N] or not matching the format, as well as
    the solution terminating without having got the answer "=", count as a wrong
    answer.

    After each query the output buffer must be flushed: in C++ — endl
    (iostream) or fflush(stdout) (stdio); in Java — System.out.println()
    or flush() of another output stream; in Python — print(..., flush=True) and
    reading via input().
  references: []

# ---------------------------------------------------------------------------
# 2. LIMITS — the constraints_pick step (+ the validator)
# ---------------------------------------------------------------------------
constraints:
  intended_complexity: "O(log N) queries"
  complexity_reasoning: |
    A binary search over the range: a segment [lo, hi] of candidates
    is maintained, mid = (lo + hi) / 2 is queried; the answer "=" ends
    the work, "<" narrows the segment to [lo, mid - 1], ">" — to [mid + 1, hi].
    Each query halves the number of candidates approximately, so
    ceil(log2(N)) <= ceil(log2(1000)) = 10 queries are enough — exactly
    the author's limit. The limit is tight: on the worst X with N = 1000 exactly
    10 queries are needed. Binary search variants with a separate final query and with
    hi = mid instead of hi = mid - 1 fit into it (checked over all N and X).
    The solution's running time outside the interaction — O(1) per query.
  variables:
    - name: "N"
      min: 1
      max: 1000
      description: "the upper bound of the range: the hidden number lies in [1; N]"
    - name: "X"
      min: 1
      max: "N"
      description: "the hidden number (the test's hidden data)"
    - name: "Q"
      min: 0
      max: 10
      description: "the query limit for the solution"
  special_guarantees:
    - "the limit of 10 queries doesn't depend on N"
    - "the hidden number X is fixed before the interaction starts and doesn't change (the interactor isn't adaptive)"
  test_groups_hint: []
  test_groups_needed: false
  time_limit_seconds: 1
  memory_limit_mb: 256
  references: []

# ---------------------------------------------------------------------------
# 3. GENERATORS AND TEST-SCRIPT — the tests_plan, generators_draft, test_script_draft steps
# ---------------------------------------------------------------------------
generation:
  generator_ideas:
    - name: "gen_pow2_delta"
      params: ["p", "delta", "x"]
      purpose: |
        N = 2^p + delta, delta from {-1, 0, 1}; the hidden number X is set by
        the parameter x. Fails if the resulting N goes outside the allowed
        range or x doesn't lie in [1, N].
    - name: "gen_rand"
      params: ["minN", "maxN"]
      purpose: "a random N from [minN, maxN] and a random hidden X from [1, N]"
    - name: "gen_fixed"
      params: ["n", "x"]
      purpose: "a test with explicitly given N and X — for enumerating particular edge cases"
    - name: "gen_worst_x"
      params: ["n"]
      purpose: |
        N is given, X is chosen as the hidden number on which
        the standard binary search makes the maximal number of queries (simulating
        the binary search for all X from [1, N] and choosing the X with the longest
        dialogue).
  specific_test_ideas:
    - "N = a power of two plus delta (delta from {-1, 0, 1}) for all p at which N gets into [1, 1000]"
    - "the hidden X = 1 and X = N (for N = 1000 and for N — powers of two + delta)"
    - "N = 1 (the only possible hidden number)"
    - "N = 1000 (the maximum), the hidden numbers 1, 2, 500, 501, 512, 513, 999, 1000 and a few random ones"
    - "all pairs (N, X) for N from 1 to 8 and all X from [1, N]"
    - "the worst hidden number for N = 1000 and for N = 1000 - 1, 512, 513 — a dialogue of exactly 10 queries, catches solutions that need an 11th query"
    - "random N from [1, 1000] with random hidden X"
  script_style: "flat"
  references: []

# ---------------------------------------------------------------------------
# 4. SOLUTION DRAFTS — the solutions_draft step
# ---------------------------------------------------------------------------
solutions:
  wanted_verdicts: ["ok", "wa", "il"]
  languages: ["cpp", "java", "py"]
  algorithm_hint: |
    Read N. Maintain a segment of candidates [lo, hi], initially
    [1, N]. While lo <= hi: ask "? mid", where mid = (lo + hi) / 2;
    on the answer "=" terminate, on "<" set hi = mid - 1, on ">" —
    lo = mid + 1. After each query — flush the output buffer.
  alternative_approaches:
    - "a recursive binary search over the segment [lo, hi] instead of a loop"
    - "a prebuilt perfect binary search tree over [1, N] and descending it according to the answers"
    - "a binary search narrowing the segment to a single candidate and only then asking the final query: fits into the limit of 10 queries"
    - "a binary search with hi = mid instead of hi = mid - 1 (together with lo = mid + 1): a candidate stays in the segment, but it fits into the limit of 10 queries"
  known_wrong_approaches:
    - "wa: a linear search X = 1, 2, 3, ... — more than 10 queries already with N = 12"
    - "wa: the answers \"<\" and \">\" are swapped (the segment narrows in the opposite direction)"
    - "wa: a binary search over the segment [2, N - 1] (or [1, N - 1]) — doesn't find hidden numbers at the edges of the range"
    - "il (cpp/java/py): a correct binary search without flushing the output buffer — the interactor doesn't get the query, the interaction hangs (Idleness limit exceeded); in Python — print without flush=True and reading via sys.stdin.readline()"
  references: []

# ---------------------------------------------------------------------------
# 5. CHECKER — the checker_draft step (only with custom_needed: true)
# ---------------------------------------------------------------------------
checker:
  standard: "ncmp"
  custom_needed: false
  custom_comparison_notes: null
  references: []

# ---------------------------------------------------------------------------
# 6. INTERACTOR — the interactor_draft step (only for an interactive problem)
# ---------------------------------------------------------------------------
interactor:
  behavior_notes: |
    The interactor reads N and the hidden number X from the test file and prints
    N to the solution. The interactor isn't adaptive: X is fixed by the test file.

    Then it reads the solution's queries. A correct query is the character "?" and an integer
    X_q, with 1 <= X_q <= N. To a query the interactor answers:
      - "<" if X < X_q;
      - ">" if X > X_q;
      - "=" if X = X_q.

    The query counter: if the solution makes an 11th query — the verdict
    "wrong answer" (_wa, "query limit exceeded: more than 10").

    Having answered "=", the interactor writes the hidden number X to tout,
    exits with _ok (the test is passed) and doesn't check the solution's further
    queries.

    Solution errors (all — _wa):
      - an invalid query format (no "?", not an integer);
      - X_q outside [1, N];
      - more than 10 queries;
      - the solution terminated (end of stream) without having got the answer "=".

    The interactor writes one number to tout — the value guessed by the solution
    (which is X); the ncmp checker compares it with the tout of the reference run.
  references: []

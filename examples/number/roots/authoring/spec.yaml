problem_id: number--roots
title:
  ru: "Целые корни"
  en: "Integer roots"
references:
  - "examples/array/prefix-sums"

statement_draft:
  legend_sketch: |
    Given a positive integer N. Find the integer part (rounded down)
    of its cube root and the integer part of its square root.
  formal_input_sketch: |
    The only line has one integer N (1 <= N <= 10^18).
  formal_output_sketch: |
    On one line, separated by a space, two integers: first floor(N^(1/3)) —
    the largest integer C for which C^3 <= N, then floor(sqrt(N)) —
    the largest integer S for which S^2 <= N.
    The answer always exists and is unique.
  indexing: "irrelevant"
  sample_examples:
    - input: |
        27
      output: |
        3 5
      note_hint: |
        3^3 = 27 <= 27 < 64 = 4^3, so the cube root is 3.
        5^2 = 25 <= 27 < 36 = 6^2, so the square root, rounded down, is 5.
    - input: |
        63
      output: |
        3 7
      note_hint: |
        3^3 = 27 <= 63 < 64 = 4^3; 7^2 = 49 <= 63 < 64 = 8^2.
        The number is one less than an exact power: both roots are rounded down.

constraints:
  intended_complexity: "O(log N)"
  complexity_reasoning: |
    Each root is found by a binary search on the answer: for the square one — on
    [0, 10^9], for the cube one — on [0, 10^6]; the check mid^k <= N
    is done without overflowing a 64-bit type (the binary search bounds
    are chosen so that mid^k <= 10^18, or the comparison is done via
    division). An alternative is a floating-point root (sqrtl/cbrtl) with
    an integer correction of the result by +-1 in both directions.
  variables:
    - name: "N"
      min: 1
      max: 1000000000000000000
      description: "the number the roots are extracted from"
  test_groups_needed: false
  time_limit_seconds: 1
  memory_limit_mb: 256

generation:
  generator_ideas:
    - name: "gen_n_rand"
      params: ["minN", "maxN"]
      purpose: "a random N from the range [minN, maxN]"
    - name: "gen_n_power"
      params: ["k", "maxN", "minB", "delta"]
      purpose: |
        N = B^k + delta for a random B from [minB, maxB], where maxB is
        the largest B for which B^k + delta <= maxN (found by a binary search
        on the answer). If minB > maxB — the generator fails with an error.
        Necessarily used with k = 2, 3, 6; also with k = 4, 5, 12 and
        delta from {-1, 0, +1}.
    - name: "gen_n_pow_of_base"
      params: ["b", "p", "delta"]
      purpose: |
        N = b^p + delta for a fixed base (powers of two,
        powers of ten, the largest B for k = 2, 3, 6); fails if b^p doesn't
        fit into a 64-bit type. Doesn't check the range of N — the script
        calls the generator only for allowed N.
  specific_test_ideas:
    - "all N from 1 to 30"
    - "N = 10^18 (it's both 10^6 cubed and 10^9 squared)"
    - "N = 10^18 - 1"
    - "exact squares B^2 and B^2 - 1, B^2 + 1 for large B (close to 10^9)"
    - "exact cubes B^3 and B^3 - 1, B^3 + 1 for large B (close to 10^6)"
    - "sixth powers B^6 (both roots are integer) and B^6 +- 1, including the maximal B = 1000"
    - "powers of two 2^p and 2^p +- 1 for p up to 59"
    - "powers of ten 10^p and 10^p +- 1"
    - "random N over the whole range"
  script_style: "flat"

solutions:
  wanted_verdicts: ["ok", "wa", "tl_ok"]
  languages: ["cpp", "java", "py"]
  algorithm_hint: |
    Two independent binary searches on the answer: the largest C with C^3 <= N
    (C in [0, 10^6]) and the largest S with S^2 <= N (S in [0, 10^9]). Computations
    in a 64-bit signed type (in Python — integer arithmetic);
    the binary search bounds are such that mid^k doesn't overflow.
  alternative_approaches:
    - "a floating-point root (sqrtl/cbrtl in C++, Math.sqrt/Math.cbrt in Java, math.sqrt and ** (1 / 3) in Python) with an integer correction of the result by +-1 in both directions until C^3 / S^2 become correct"
    - "(py): the square root via math.isqrt, the cube one — with the same binary search"
  known_wrong_approaches:
    - "wa (cpp): (long long)sqrt((double)N) without correction — a mistake on B^2 - 1 for large B (double doesn't distinguish neighboring numbers near 10^18)"
    - "wa (cpp): (long long)cbrt((double)N) without correction — a mistake on B^3 - 1 for large B"
    - "wa (cpp): the cube root as pow(N, 1.0 / 3) without correction — a mistake already on exact cubes (e.g. 64 -> 3)"
    - "wa (py): int(N ** 0.5) without correction — a mistake on B^2 - 1 for large B"
    - "wa (py): int(N ** (1 / 3)) without correction — a mistake already on exact cubes (e.g. 64 -> 3)"
    - "wa: a binary search for the cube root on [0, N] with mid * mid * mid in a 64-bit type — an overflow with N greater than ~4 * 10^6, on the examples and small N the answer is correct"
    - "wa: a binary search for the square root with a strict mid * mid < N instead of <= — a mistake on exact squares"
    - "tl_ok: a linear search for the square root S = 0, 1, 2, ... while (S + 1)^2 <= N — up to 10^9 iterations, a borderline case: in C++ with N = 10^18 about 0.3 s, in Python certainly TL"

checker:
  standard: "ncmp"
  custom_needed: false
  custom_comparison_notes: null

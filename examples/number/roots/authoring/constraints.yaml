problem_id: number--roots
intended_complexity: "O(log N)"
complexity_reasoning: |
  Каждый корень ищется бинпоиском по ответу: для квадратного — на
  [0, 10^9], для кубического — на [0, 10^6]; проверка mid^k <= N
  выполняется без переполнения 64-битного типа (границы бинпоиска
  выбраны так, что mid^k <= 10^18, либо сравнение делается через
  деление). Альтернатива — вещественный корень (sqrtl/cbrtl) с
  целочисленной корректировкой результата на +-1 в обе стороны.

variables:
  - name: "N"
    min: 1
    max: 1000000000000000000
    description: "число, из которого извлекаются корни"
    status: confirmed

limits:
  time_limit_seconds: 1
  memory_limit_mb: 256
  status: confirmed
  rationale: |
    Заданы автором явно (1 секунда, 256 Мб) и используются как есть.
    Согласованность с O(log N): при N = 10^18 бинпоиск делает порядка
    60 итераций (log2(10^9) ~ 30 на квадратный корень и log2(10^6) ~ 20
    на кубический), то есть десятки операций — на много порядков меньше
    бюджета 1 секунды даже на интерпретируемых языках. Памяти требуется
    O(1) (несколько 64-битных переменных), 256 Мб с огромным запасом.
    При этом наивный перебор корня до 10^9 (~10^9 итераций с
    умножениями) в 1 секунду не укладывается, то есть лимит отсекает
    неэффективные решения.

# test_groups отсутствует: test_groups_hint в спеке пуст и
# test_groups_needed: false — группы автору не нужны.

validator:
  constants:
    - name: "N"
      cpp_type: ll
      min: 1
      max: 1000000000000000000
  checks:
    - "единственная строка: одно число N, конец строки"
    - "после единственной строки — конец файла"

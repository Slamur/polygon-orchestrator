problem_id: number--roots
intended_complexity: "O(log N)"
complexity_reasoning: |
  Each root is found by a binary search on the answer: for the square one — on
  [0, 10^9], for the cube one — on [0, 10^6]; the check mid^k <= N
  is done without overflowing a 64-bit type (the binary search bounds
  are chosen so that mid^k <= 10^18, or the comparison is done via
  division). An alternative is a floating-point root (sqrtl/cbrtl) with
  an integer correction of the result by +-1 in both directions.

variables:
  - name: "N"
    min: 1
    max: 1000000000000000000
    description: "the number the roots are extracted from"
    status: confirmed

limits:
  time_limit_seconds: 1
  memory_limit_mb: 256
  status: confirmed
  rationale: |
    Set by the author explicitly (1 second, 256 MB) and are used as is.
    Consistency with O(log N): with N = 10^18 the binary search makes of the order of
    60 iterations (log2(10^9) ~ 30 for the square root and log2(10^6) ~ 20
    for the cube one), that is, tens of operations — many orders of magnitude less than
    the budget of 1 second even in interpreted languages. Memory required is
    O(1) (a few 64-bit variables), 256 MB with a huge margin.
    At the same time a naive search for the root up to 10^9 (~10^9 iterations with
    multiplications) doesn't fit into 1 second, that is, the limit cuts off
    inefficient solutions.

# test_groups is absent: test_groups_hint in the spec is empty and
# test_groups_needed: false — the author doesn't need groups.

validator:
  constants:
    - name: "N"
      cpp_type: ll
      min: 1
      max: 1000000000000000000
  checks:
    - "the only line: one number N, end of line"
    - "after the only line — end of file"

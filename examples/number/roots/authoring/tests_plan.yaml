problem_id: number--roots

# A test is one number N on a single line.
generators:
  - name: gen_n_rand
    status: confirmed
    params:
      - name: minN
        type: ll
        description: the smallest N
      - name: maxN
        type: ll
        description: the largest N
    input: null
    output: the whole test — N
    algorithm: |
      N is a random one from [minN, maxN].

  - name: gen_n_power
    status: confirmed
    params:
      - name: k
        type: int
        description: the exponent
      - name: maxN
        type: ll
        description: the largest N
      - name: minB
        type: ll
        description: the smallest base
      - name: delta
        type: ll
        description: the shift of N from B^k
    input: null
    output: the whole test — N
    algorithm: |
      maxB is the largest B for which B^k <= maxN - delta (a binary search on the
      answer without overflowing a 64-bit type); B is a random one from [minB, maxB],
      N = B^k + delta. Fails if minB > maxB.

  - name: gen_n_pow_of_base
    status: confirmed
    params:
      - name: b
        type: ll
        description: the base
      - name: p
        type: int
        description: the exponent
    input: null
    output: the whole test — N
    algorithm: |
      N = b^p + delta, delta is a random one from {-1, 0, 1} (the generator chooses it
      itself: this way script lines for different delta aren't needed). Fails if
      b^p doesn't fit into a 64-bit signed type. Doesn't check the range of N —
      the script calls the generator only for allowed N.

constants:
  - name: minN
    value: "1"
    description: N.min from constraints.yaml
  - name: maxNExp
    value: "18"
    description: N.max = 10^maxNExp from constraints.yaml
  - name: maxN
    value: 10^maxNExp
    description: N.max from constraints.yaml
  - name: tinyMaxN
    value: "20"
    description: all N in a row up to this bound
  - name: smallMaxN
    value: "1000"
    description: the bound of small random tests
  - name: deltas
    value: "[-1, 0, 1]"
    description: the shifts from an exact power
  - name: pow2Exps
    value: "[6, 10, 20, 30, 31, 32, 48, 53, 54, 59]"
    description: |
      powers of two: 2^6 = 4^3 = 8^2, 2^30 = 1024^3 = 32768^2, 2^31 / 2^32 —
      the int / unsigned int bounds, 2^48 = 65536^3, 2^53 / 2^54 — the double
      precision bound, 2^59 — the largest power of 2 <= 10^18
  - name: pow10Exps
    value: "[2, 3, 6, 9, 12, 15, 16, 17]"
    description: powers of ten — squares, cubes and neither, all less than maxN - 1
  - name: powerExps
    value: "[2, 3, 4, 5, 6, 12]"
    description: the exponents for random B^k + delta
  - name: topExps
    value: "[2, 3, 6]"
    description: the exponents for which maxN is an exact power of topB = 10^(maxNExp / k)

tests:
  - description: All N from 1 to 20
    status: proposed
    covers:
      - specific_test_ideas[0]
    commands:
      - gen_n_rand -minN=n -maxN=n
    repeat: n = minN..tinyMaxN
    rationale: |
      The bound is 20 instead of 30 from the spec: N from 21 to 30 are covered by random
      small tests and the exact powers below.

  - description: Random small and medium N
    status: proposed
    covers: []
    commands:
      - gen_n_rand -minN=minN -maxN=smallMaxN
      - gen_n_rand -minN=smallMaxN -maxN=smallMaxN*smallMaxN
    repeat: null

  - description: Powers of two and ten ± 1
    status: confirmed
    covers:
      - specific_test_ideas[6]
      - specific_test_ideas[7]
      - known_wrong_approaches[2]
      - known_wrong_approaches[4]
    commands:
      - gen_n_pow_of_base -b=2 -p=p
      - gen_n_pow_of_base -b=10 -p=q
    repeat: the first command — p over pow2Exps, then the second — q over pow10Exps

  - description: Random B^k + delta up to the largest allowed B
    status: confirmed
    covers:
      - specific_test_ideas[3]
      - specific_test_ideas[4]
      - specific_test_ideas[5]
      - known_wrong_approaches[0]
      - known_wrong_approaches[1]
      - known_wrong_approaches[3]
      - known_wrong_approaches[6]
    commands:
      - gen_n_power -k=k -maxN=maxN -minB=minB -delta=delta
    repeat: k over powerExps, delta over deltas; minB = max(1, 1 - delta) — with delta = -1 B >= 2, otherwise N = 0

  - description: B^k + delta for the largest B (topB - 1)
    status: confirmed
    covers:
      - specific_test_ideas[3]
      - specific_test_ideas[4]
      - specific_test_ideas[5]
    commands:
      - gen_n_pow_of_base -b=b -p=k
    repeat: k over topExps, b = 10^(maxNExp / k) - 1 — the largest B for which any delta is allowed

  - description: Maximal tests — N = 10^18 and N = 10^18 - 1
    status: confirmed
    covers:
      - specific_test_ideas[1]
      - specific_test_ideas[2]
      - known_wrong_approaches[5]
      - known_wrong_approaches[7]
    commands:
      - gen_n_rand -minN=maxN -maxN=maxN
      - gen_n_rand -minN=maxN-1 -maxN=maxN-1
    repeat: null

  - description: Random N over the whole range
    status: confirmed
    covers:
      - specific_test_ideas[8]
    commands:
      - gen_n_rand -minN=minN -maxN=maxN
      - gen_n_rand -minN=maxN/2 -maxN=maxN
      - gen_n_rand -minN=minN -maxN=maxN/2
    repeat: null

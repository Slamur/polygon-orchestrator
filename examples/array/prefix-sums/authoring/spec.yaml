# The spec of the sample problem for which all files of this directory are written
# (validator.cpp, checker.cpp, generators/*, test_script, solutions/*).
# Attached to model calls together with the templates as a
# "here is the problem's spec -> here is what was expected from it" pair. It doesn't lie in problems/
# on purpose: it's not a problem for generation.
problem_id: array--prefix-sums        # the sample problem's path in examples/ joined with "--"
title:
  ru: "Префикс с большой суммой"
  en: "Prefix with a large sum"

statement_draft:
  legend_sketch: |
    Given an array of non-negative integers and a number K. Find the
    shortest prefix of the array whose sum of elements is strictly greater than K.
  formal_input_sketch: |
    The first line has two integers N and K (1 <= N <= 2 * 10^5, 0 <= K <= 10^15) — the length of the array and the sum threshold.
    The second line has N integers $A_1, \ldots, A_N$ (0 <= A_i <= 10^9) — the elements of the array.
  formal_output_sketch: |
    If there is an index i (1 <= i <= N) for which A_1 + ... + A_i > K, print "YES" on the first
    line, and the minimal such i on the second.
    If there is no such index, print a single line "NO".
  indexing: "1-indexed"
  sample_examples:
    - input: |
        5 6
        2 1 3 5 4
      output: |
        YES
        4
      note_hint: |
        Consider the sums of all prefixes of the array:

        - A_1 = 2 <= K
        - A_1 + A_2 = 3 <= K
        - A_1 + A_2 + A_3 = 6 <= K
        - A_1 + A_2 + A_3 + A_4 = 11 > K
        - A_1 + A_2 + A_3 + A_4 + A_5 = 15 > K

        The first index i for which the sum A_1 + A_2 + ... + A_i > K is 4.
    - input: |
        3 10
        2 0 7
      output: |
        NO
      note_hint: "The sum of the whole array doesn't exceed K"

constraints:
  intended_complexity: "O(N)"
  complexity_reasoning: |
    One pass over the array accumulating the prefix sum; the answer is the first
    index at which the sum became strictly greater than K.
  variables:
    - name: "N"
      min: 1
      max: 200000
      description: "the length of the array"
    - name: "K"
      min: 0
      max: 1000000000000000
      description: "the threshold for the prefix sum"
    - name: "A_i"
      min: 0
      max: 1000000000
      description: "an element of the array"
  time_limit_seconds: 1
  memory_limit_mb: 256

generation:
  generator_ideas:
    - name: "gen_array_rand"
      params: ["n", "minA", "maxA"]
      purpose: "a random array: prints N and the array, the next generator in the chain appends K"
    - name: "gen_array_distinct"
      params: ["n", "minA", "maxA"]
      purpose: "a random array of pairwise distinct values"
    - name: "gen_k_rand"
      params: ["minK", "maxK"]
      purpose: "reads N and the array from standard input, appends a random K from the range"
    - name: "gen_k_too_large"
      params: ["maxK"]
      purpose: "reads N and the array, chooses K no less than the sum of the whole array — the answer is NO"
    - name: "gen_k_eq_pref"
      params: ["minK", "maxK", "delta"]
      purpose: "reads N and the array, chooses K = (the sum of a random prefix) + delta, bringing it within [minK, maxK]"
    - name: "upd_array_sort"
      params: ["desc"]
      purpose: "reads a ready test and sorts the array in ascending order (with the desc flag — in descending order)"
  specific_test_ideas:
    - "all N from 1 to 10 with small values of A_i and K"
    - "N = N_max, all A_i = A_max"
    - "N = N_max, K = K_max"
    - "K equals the sum of some prefix, and also 1 less and 1 more"
    - "the answer NO: K is no less than the sum of the whole array"
  script_style: "flat"

solutions:
  wanted_verdicts: ["ok", "wa", "tl"]
  languages: ["cpp", "java", "py"]
  algorithm_hint: |
    Compute the prefix sums in a 64-bit type and find the first index at
    which the sum is strictly greater than K. If there's none — the answer is NO.
  known_wrong_approaches:
    - "wa (cpp): prefix sums in a 32-bit type — overflow with large A_i"
    - "wa (py): a non-strict comparison of the prefix sum with K (>= instead of >)"
    - "tl (cpp): O(N^2) — the sum of each prefix is recomputed anew"
    - "tl_ok (java): the correct algorithm with unbuffered input/output"

checker:
  standard: null
  custom_needed: true
  custom_comparison_notes: |
    Input: N, K and an array A of N numbers.
    Answer: the first token is "YES" or "NO", strictly in upper case.
    After "NO" there must be nothing else. After "YES" comes one integer
    i from 1 to N.
    Checking the answer: the sum A_1 + ... + A_i must be strictly greater than K,
    otherwise the answer is wrong.
    Comparison: a smaller index is better; "NO" is worse than any index. The participant's
    answer must be no worse than the jury's; if it's strictly better —
    that's a jury error (fail).

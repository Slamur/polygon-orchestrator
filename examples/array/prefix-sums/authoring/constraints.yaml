# A sample result of the constraints_pick step for the spec.yaml from this directory —
# a "spec -> expected constraints.yaml" pair. validator.cpp is written
# from it too (the validator section below is implemented in it 1-to-1),
# and test_script takes the limit values from it.
#
# In the sample spec all values are set by the author, so everywhere
# status: confirmed. A value the step proposed itself (e.g. the max
# of a variable with max: null in the spec) is marked status: proposed with
# a justification in rationale — and an entry in the model's response notes.
problem_id: array--prefix-sums
intended_complexity: "O(N)"
complexity_reasoning: |
  One pass over the array accumulating the prefix sum; the answer is the first
  index at which the sum became strictly greater than K.

variables:
  - name: "N"
    min: 1
    max: 200000
    description: "the length of the array"
    status: confirmed
  - name: "K"
    min: 0
    max: 1000000000000000
    description: "the threshold for the prefix sum"
    status: confirmed
  - name: "A_i"
    min: 0
    max: 1000000000
    description: "an element of the array"
    status: confirmed

limits:
  time_limit_seconds: 1
  memory_limit_mb: 256
  status: confirmed
  rationale: |
    Set by the author explicitly. Consistency with O(N): with N = 2 * 10^5 it's
    ~2 * 10^5 operations plus reading the input — orders of magnitude less than 1 second
    even in Python; an O(N^2) solution (~2 * 10^10 operations) doesn't fit
    into 1 second.

# test_groups is absent: the spec has no test_groups_hint and
# test_groups_needed isn't set — the author doesn't need groups.

validator:
  constants:
    - name: "N"
      cpp_type: int
      min: 1
      max: 200000
    - name: "K"
      cpp_type: ll
      min: 0
      max: 1000000000000000
    - name: "A_i"
      cpp_type: int
      min: 0
      max: 1000000000
  checks:
    - "the first line: N, one space, K, end of line"
    - "the second line: N numbers A_i separated by one space, end of line"
    - "after the second line — end of file"

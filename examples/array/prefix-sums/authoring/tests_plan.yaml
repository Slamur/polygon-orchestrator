problem_id: array--prefix-sums

generators:
  - name: gen_array_rand
    status: confirmed
    params:
      - name: n
        type: int
        description: the length of the array
      - name: minA
        type: int
        description: the smallest value of an element
      - name: maxA
        type: int
        description: the largest value of an element
    input: null
    output: the beginning of the test — N on the first line, the array A on the second; the next generator of the chain appends K
    algorithm: |
      Each element is an independent random number from [minA, maxA].

  - name: gen_array_distinct
    status: confirmed
    params:
      - name: n
        type: int
        description: the length of the array
      - name: minA
        type: int
        description: the smallest value of an element
      - name: maxA
        type: int
        description: the largest value of an element, maxA - minA + 1 >= n
    input: null
    output: the beginning of the test — N on the first line, the array A on the second
    algorithm: |
      n pairwise distinct random values from [minA, maxA]
      (rnd.distinct), shuffled into a random order.

  - name: gen_k_rand
    status: confirmed
    params:
      - name: minK
        type: ll
        description: the smallest K
      - name: maxK
        type: ll
        description: the largest K
    input: N on the first line and the array A on the second (from gen_array_*)
    output: the whole test — N and K on the first line, the array A on the second
    algorithm: |
      K is a random number from [minK, maxK].

  - name: gen_k_too_large
    status: confirmed
    params:
      - name: maxK
        type: ll
        description: the largest K, no less than the array's sum
    input: N on the first line and the array A on the second (from gen_array_*)
    output: the whole test — N and K on the first line, the array A on the second
    algorithm: |
      K is a random number from [the sum of the whole array, maxK] (the sum — in a 64-bit
      type), so that no prefix is greater than K and the answer is NO.

  - name: gen_k_eq_pref
    status: confirmed
    params:
      - name: minK
        type: ll
        description: the smallest K
      - name: maxK
        type: ll
        description: the largest K
      - name: delta
        type: int
        description: the shift of K from the prefix sum (usually -1, 0, 1)
    input: N on the first line and the array A on the second (from gen_array_*)
    output: the whole test — N and K on the first line, the array A on the second
    algorithm: |
      The sums of all prefixes (including the empty one) are computed in a 64-bit type; K is
      a random one of them plus delta, brought within [minK, maxK].

  - name: upd_array_sort
    status: confirmed
    params:
      - name: desc
        type: bool
        description: the flag of sorting in descending order
    input: a ready test — N and K on the first line, the array A on the second
    output: the same test with the sorted array
    algorithm: |
      The array is sorted in ascending order, with the desc flag — in descending order; N and K
      don't change.

constants:
  - name: minN
    value: "1"
    description: N.min from constraints.yaml
  - name: maxN
    value: 2 * 10^5
    description: N.max from constraints.yaml
  - name: minK
    value: "0"
    description: K.min from constraints.yaml
  - name: maxK
    value: 10^15
    description: K.max from constraints.yaml
  - name: minA
    value: "0"
    description: A_i.min from constraints.yaml
  - name: maxA
    value: 10^9
    description: A_i.max from constraints.yaml
  - name: smallN
    value: "10"
    description: the bound of small tests
  - name: smallA
    value: 10^2
    description: small values of A_i
  - name: smallK
    value: n * smallA
    description: a small K for a test with n elements — of the order of the array's sum

tests:
  - description: All N from 1 to 10 with small A_i and K
    status: confirmed
    covers:
      - specific_test_ideas[0]
    commands:
      - gen_array_rand -n=n -minA=minA -maxA=smallA | gen_k_rand -minK=minK -maxK=smallK
    repeat: n = minN..smallN

  - description: All N from 1 to 10 with the full range of A_i and K
    status: proposed
    covers: []
    commands:
      - gen_array_rand -n=n -minA=minA -maxA=maxA | gen_k_rand -minK=minK -maxK=maxK
    repeat: n = minN..smallN
    rationale: |
      Small N with large values — an overflow without maximal N.

  - description: Maximal N with pairwise distinct A_i, in random order and sorted
    status: proposed
    covers:
      - known_wrong_approaches[2]
      - known_wrong_approaches[3]
    commands:
      - gen_array_distinct -n=maxN -minA=minA -maxA=maxA | gen_k_rand -minK=minK -maxK=maxK
      - gen_array_distinct -n=maxN -minA=minA -maxA=maxA | gen_k_rand -minK=minK -maxK=maxK | upd_array_sort
      - gen_array_distinct -n=maxN -minA=minA -maxA=maxA | gen_k_rand -minK=minK -maxK=maxK | upd_array_sort --desc
    repeat: null
    rationale: |
      The maximal N catches O(N^2) and slow input/output.

  - description: N = maxN, A_i from startA to maxA (with startA = maxA all A_i = maxA) — a random K, the answer NO, K near a prefix sum
    status: confirmed
    covers:
      - specific_test_ideas[1]
      - specific_test_ideas[2]
      - specific_test_ideas[3]
      - specific_test_ideas[4]
      - known_wrong_approaches[0]
      - known_wrong_approaches[1]
    commands:
      - gen_array_rand -n=maxN -minA=startA -maxA=maxA | gen_k_rand -minK=startK -maxK=maxK
      - gen_array_rand -n=maxN -minA=startA -maxA=maxA | gen_k_too_large -maxK=maxK
      - gen_array_rand -n=maxN -minA=startA -maxA=maxA | gen_k_eq_pref -minK=minK -maxK=maxK -delta=delta
    repeat: |
      startA over [minA, maxA]; for each — the first command for startK over
      [minK, maxK] (with startK = maxK — K = K_max), the second once, the third
      for delta = -1..1

problem_id: array--range-queries-increase-offline
intended_complexity: "O(N + Q)"
complexity_reasoning: |
  A difference array: for each operation inc[L] += D, inc[R + 1] -= D
  (the array inc of size N + 2), then the answer is the prefix sums of inc.
  The absolute values reach Q * max|D| = 3 * 10^14 — a 64-bit type is needed.

variables:
  - name: "N"
    min: 1
    max: 300000
    description: "the length of the array"
    status: confirmed
  - name: "Q"
    min: 1
    max: 300000
    description: "the number of operations"
    status: confirmed
  - name: "L_i"
    min: 1
    max: N
    description: "the left bound of the i-th operation's segment"
    status: confirmed
  - name: "R_i"
    min: L_i
    max: N
    description: "the right bound of the i-th operation's segment"
    status: confirmed
  - name: "D_i"
    min: -1000000000
    max: 1000000000
    description: "the number added by the i-th operation"
    status: confirmed

limits:
  time_limit_seconds: 2
  memory_limit_mb: 256
  status: confirmed
  rationale: |
    Set by the author explicitly (2.0 s — a whole number of seconds, 256 MB). Consistency
    with O(N + Q): with N = Q = 3 * 10^5 it's ~6 * 10^5 operations on the difference
    array plus reading 9 * 10^5 numbers and printing 3 * 10^5 — the main
    cost is exactly in the input/output, which fits into 2
    seconds in C++/Java with a margin. Memory: an array of N + 2 values of type
    long long — about 2.4 MB, which fits into 256 MB. A naive solution
    in O(N * Q) (up to 9 * 10^10 operations) doesn't fit into 2 seconds by a
    large margin.

# test_groups is absent: the spec has test_groups_needed: false and
# test_groups_hint is empty — the author doesn't need groups.

validator:
  constants:
    - name: "N"
      cpp_type: int
      min: 1
      max: 300000
    - name: "Q"
      cpp_type: int
      min: 1
      max: 300000
    - name: "L_i"
      cpp_type: int
      min: 1
      max: N
    - name: "R_i"
      cpp_type: int
      min: L_i
      max: N
    - name: "D_i"
      cpp_type: int
      min: -1000000000
      max: 1000000000
  checks:
    - "the first line: N, one space, Q, end of line"
    - "the second line: L_1, ..., L_Q separated by one space, end of line; each L_i is read within [1, N]"
    - "the third line: R_1, ..., R_Q separated by one space, end of line; each R_i is read within [1, N]"
    - "the fourth line: D_1, ..., D_Q separated by one space, end of line; each D_i is read within [-10^9, 10^9]; this checks |D_i| <= 10^9"
    - "after the fourth line — end of file"
    - "after reading the whole input: for each i L_i <= R_i is checked; together with the bounds on reading this gives 1 <= L_i <= R_i <= N"

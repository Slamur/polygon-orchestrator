problem_id: array--range-queries-increase-offline

# All generators print the test the same way: N and Q on the first line, then Q
# left bounds, Q right bounds and Q numbers D (each a random one from
# [minD, maxD]) — a line per list.
generators:
  - name: gen_queries_rand
    status: confirmed
    params:
      - name: n
        type: int
        description: the length of the array
      - name: q
        type: int
        description: the number of operations
      - name: minD
        type: int
        description: the smallest D
      - name: maxD
        type: int
        description: the largest D
    input: null
    output: the whole test
    algorithm: |
      Each operation is two random numbers from [1, n], ordered so
      that L <= R; D is a random one from [minD, maxD].

  - name: gen_queries_all_segments
    status: confirmed
    params:
      - name: n
        type: int
        description: the length of the array, n * (n + 1) / 2 no more than the maximal Q
      - name: minD
        type: int
        description: the smallest D
      - name: maxD
        type: int
        description: the largest D
    input: null
    output: the whole test, Q = n * (n + 1) / 2
    algorithm: |
      All segments [L, R], 1 <= L <= R <= n, once each, shuffled into a
      random order; D of each operation is a random one from [minD, maxD].

  - name: gen_queries_grid
    status: confirmed
    params:
      - name: n
        type: int
        description: the length of the array
      - name: q
        type: int
        description: the desired number of operations; K * K is taken, K = floor(sqrt(q))
      - name: start
        type: int
        description: the smallest left bound
      - name: end
        type: int
        description: the largest right bound
      - name: minD
        type: int
        description: the smallest D
      - name: maxD
        type: int
        description: the largest D
    input: null
    output: the whole test, Q = K * K
    algorithm: |
      K = floor(sqrt(q)), K >= 1. The left bounds — start..start + K - 1,
      the right ones — end - K + 1..end; the operations — all K * K pairs (L, R) in random
      order, D is a random one from [minD, maxD]. Fails if some bound is
      outside [1, n] or the largest left one is greater than the smallest right one.

  - name: gen_queries_fixed_lr
    status: proposed
    params:
      - name: n
        type: int
        description: the length of the array
      - name: q
        type: int
        description: the number of operations
      - name: l
        type: int
        description: the left bound of all operations, 1 <= l <= n
      - name: r
        type: int
        description: the right bound of all operations, l <= r <= n
      - name: minD
        type: int
        description: the smallest D
      - name: maxD
        type: int
        description: the largest D
    input: null
    output: the whole test
    algorithm: |
      All q operations are on the segment [l, r], D of each is a random one from
      [minD, maxD]. Fails if l or r is out of the allowed range.
    rationale: |
      specific_test_ideas[6] (all operations on one segment) requires a
      generator the author didn't describe.

  - name: gen_queries_r_fixed
    status: proposed
    params:
      - name: n
        type: int
        description: the length of the array
      - name: q
        type: int
        description: the number of operations
      - name: r
        type: int
        description: the right bound of all operations, 1 <= r <= n
      - name: minD
        type: int
        description: the smallest D
      - name: maxD
        type: int
        description: the largest D
    input: null
    output: the whole test
    algorithm: |
      Each operation is [L, r] with a random L from [1, r], D is a random one from
      [minD, maxD]. Fails if r is outside [1, n].
    rationale: |
      specific_test_ideas[7] and known_wrong_approaches[1]: many operations with
      R = N catch the array inc without the cell R + 1.

constants:
  - name: minN
    value: "1"
    description: N.min from constraints.yaml
  - name: maxN
    value: 3 * 10^5
    description: N.max from constraints.yaml
  - name: minQ
    value: "1"
    description: Q.min from constraints.yaml
  - name: maxQ
    value: 3 * 10^5
    description: Q.max from constraints.yaml
  - name: minD
    value: -10^9
    description: D.min from constraints.yaml
  - name: maxD
    value: 10^9
    description: D.max from constraints.yaml
  - name: smallN
    value: "10"
    description: a small N — the model's choice
  - name: smallQ
    value: "10"
    description: a small Q — the model's choice
  - name: smallD
    value: "1000"
    description: a small absolute value of D — the model's choice
  - name: negSmallD
    value: -smallD
    description: the lower bound of small D
  - name: midAllSegN
    value: "774"
    description: the largest N at which all subsegments fit into maxQ (774 * 775 / 2 = 299925)
  - name: midN
    value: maxN / 2
    description: the middle of the array
  - name: midStart
    value: maxN / 4
    description: the start of the grid inside the array
  - name: midEnd
    value: 3 * maxN / 4
    description: the end of the grid inside the array

tests:
  - description: Small tests of different sizes with small D and with D over the whole range
    status: confirmed
    covers:
      - specific_test_ideas[0]
    commands:
      - gen_queries_rand -n=n -q=n -minD=negSmallD -maxD=smallD
      - gen_queries_rand -n=n -q=n -minD=minD -maxD=maxD
    repeat: n = minN..smallN

  - description: All subsegments for each N from 1 to 10, small D
    status: confirmed
    covers:
      - specific_test_ideas[1]
    commands:
      - gen_queries_all_segments -n=n -minD=negSmallD -maxD=smallD
    repeat: n = minN..smallN

  - description: All subsegments for N = 774 (Q close to the maximum)
    status: confirmed
    covers:
      - specific_test_ideas[2]
    commands:
      - gen_queries_all_segments -n=midAllSegN -minD=minD -maxD=maxD
    repeat: null

  - description: N = Q = max, a sqrt(Q) * sqrt(Q) grid with start = 1, end = N — all segments are long
    status: confirmed
    covers:
      - specific_test_ideas[3]
      - known_wrong_approaches[2]
    commands:
      - gen_queries_grid -n=maxN -q=maxQ -start=minN -end=maxN -minD=minD -maxD=maxD
    repeat: null

  - description: The same grid with D = maxD and with D = minD for all operations — an overflow of a 32-bit type
    status: confirmed
    covers:
      - specific_test_ideas[4]
      - known_wrong_approaches[0]
    commands:
      - gen_queries_grid -n=maxN -q=maxQ -start=minN -end=maxN -minD=maxD -maxD=maxD
      - gen_queries_grid -n=maxN -q=maxQ -start=minN -end=maxN -minD=minD -maxD=minD
    repeat: null

  - description: A grid with other start/end — both bounds in the middle of the array, start = end
    status: proposed
    covers:
      - specific_test_ideas[5]
    commands:
      - gen_queries_grid -n=maxN -q=1 -start=midN -end=midN -minD=minD -maxD=maxD
      - gen_queries_grid -n=maxN -q=maxQ -start=midStart -end=midEnd -minD=minD -maxD=maxD
    repeat: null
    rationale: |
      With start = end only Q = 1 is allowed — one operation at a point;
      the second command is a non-trivial grid strictly inside the array with
      Q = maxQ.

  - description: All operations on one segment — the whole array, the last cell, the first cell
    status: proposed
    covers:
      - specific_test_ideas[6]
    commands:
      - gen_queries_fixed_lr -n=maxN -q=maxQ -l=minN -r=maxN -minD=minD -maxD=maxD
      - gen_queries_fixed_lr -n=maxN -q=maxQ -l=maxN -r=maxN -minD=minD -maxD=maxD
      - gen_queries_fixed_lr -n=maxN -q=maxQ -l=minN -r=minN -minD=minD -maxD=maxD
    repeat: null
    rationale: |
      The gen_queries_fixed_lr generator is an implementation of a spec item the
      author didn't have.

  - description: Many operations with R = N
    status: proposed
    covers:
      - specific_test_ideas[7]
      - known_wrong_approaches[1]
    commands:
      - gen_queries_r_fixed -n=maxN -q=maxQ -r=maxN -minD=minD -maxD=maxD
    repeat: null
    rationale: |
      inc[R + 1] with R = N goes outside an array of size N + 1.

  - description: Random operations with N = Q = max, D over the whole range
    status: confirmed
    covers:
      - specific_test_ideas[8]
      - known_wrong_approaches[3]
      - known_wrong_approaches[4]
      - known_wrong_approaches[5]
      - known_wrong_approaches[6]
      - known_wrong_approaches[7]
      - known_wrong_approaches[8]
    commands:
      - gen_queries_rand -n=maxN -q=maxQ -minD=minD -maxD=maxD
    repeat: null

  - description: N = max and a small Q, a small N and Q = max
    status: confirmed
    covers:
      - specific_test_ideas[9]
    commands:
      - gen_queries_rand -n=maxN -q=smallQ -minD=minD -maxD=maxD
      - gen_queries_rand -n=smallN -q=maxQ -minD=minD -maxD=maxD
    repeat: null

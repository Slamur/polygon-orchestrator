problem_id: array--range-queries-increase-offline
title:
  ru: "Прибавление на отрезках"
  en: "Range additions"
references:
  - "examples/array/prefix-sums"

statement_draft:
  legend_sketch: |
    Given an array of length N, initially filled with zeros. Q operations are applied
    to it one after another: the i-th operation adds the number D_i to all
    elements with indices from L_i to R_i inclusive. Print the
    array after applying all operations.
  formal_input_sketch: |
    The first line has two integers N and Q (1 <= N, Q <= 3 * 10^5) — the length of the array and the number of operations.
    The second line has Q integers L_1, ..., L_Q (1 <= L_i <= N) — the left bounds of the operations' segments.
    The third line has Q integers R_1, ..., R_Q (L_i <= R_i <= N) — the right bounds of the segments.
    The fourth line has Q integers D_1, ..., D_Q (|D_i| <= 10^9) — the added numbers.
    The i-th operation is given by the triple (L_i, R_i, D_i).
  formal_output_sketch: |
    On one line, separated by spaces, N integers — the elements of the array after
    applying all operations, in order from the first to the N-th.
    The answer always exists and is unique.
  indexing: "1-indexed"
  sample_examples:
    - input: |
        5 3
        1 2 4
        3 5 4
        2 -1 5
      output: |
        2 1 1 4 -1
      note_hint: |
        The state of the array after each operation:

        - after the first: 2 2 2 0 0
        - after the second: 2 1 1 -1 -1
        - after the third: 2 1 1 4 -1
    - input: |
        1 1
        1
        1
        7
      output: |
        7
      note_hint: "The only operation adds 7 to the only element of the array"

constraints:
  intended_complexity: "O(N + Q)"
  complexity_reasoning: |
    A difference array: for each operation inc[L] += D, inc[R + 1] -= D
    (the array inc of size N + 2), then the answer is the prefix sums of inc.
    The absolute values reach Q * max|D| = 3 * 10^14 — a 64-bit type is needed.
  variables:
    - name: "N"
      min: 1
      max: 300000
      description: "the length of the array"
    - name: "Q"
      min: 1
      max: 300000
      description: "the number of operations"
    - name: "L_i"
      min: 1
      max: "N"
      description: "the left bound of the i-th operation's segment"
    - name: "R_i"
      min: "L_i"
      max: "N"
      description: "the right bound of the i-th operation's segment"
    - name: "D_i"
      min: -1000000000
      max: 1000000000
      description: "the number added by the i-th operation"
  test_groups_needed: false
  time_limit_seconds: 2
  memory_limit_mb: 256

generation:
  generator_ideas:
    - name: "gen_queries_rand"
      params: ["n", "q", "minD", "maxD"]
      purpose: "N and Q random operations: L <= R random in [1, N], D random from [minD, maxD]"
    - name: "gen_queries_all_segments"
      params: ["n", "minD", "maxD"]
      purpose: |
        All N * (N + 1) / 2 distinct segments [L, R] of an array of length N
        once each, in random order; Q = N * (N + 1) / 2, D of each
        operation random from [minD, maxD]. For small N; fails if
        Q exceeds the maximum.
    - name: "gen_queries_grid"
      params: ["n", "q", "start", "end", "minD", "maxD"]
      purpose: |
        K = floor(sqrt(q)); the left bounds are start, start + 1, ..., start + K - 1,
        the right ones — end - K + 1, ..., end; the operations are all K * K pairs (L, R) in
        random order, D random from [minD, maxD]. With start = 1, end = N
        and large N, Q all segments are long — catches the naive addition
        in O(N) per operation. Fails if some pair gives L > R or
        the bounds go outside [1, N].
  specific_test_ideas:
    - "N = 1, Q = 1"
    - "all subsegments for each N from 1 to 10, small D"
    - "all subsegments for N = 774 (Q = 299925, close to the maximum)"
    - "N = Q = max, a sqrt(Q) * sqrt(Q) grid with start = 1, end = N — all segments are almost the whole array"
    - "the same grid with D = 10^9 for all operations and with D = -10^9 for all operations — absolute values up to 3 * 10^14, an overflow of a 32-bit type"
    - "a grid with other start/end (e.g. both bounds in the middle of the array, start = end)"
    - "all operations on [1, N]; all operations on [N, N]; all operations on [1, 1]"
    - "many operations with R = N — catches the array inc without the cell R + 1"
    - "random operations with N = Q = max, D over the whole range"
    - "N = max, a small Q and vice versa"
  script_style: "flat"

solutions:
  wanted_verdicts: ["ok", "wa", "tl", "tl_ok", "re"]
  languages: ["cpp", "java", "py"]
  algorithm_hint: |
    A difference array inc of size N + 2 in a 64-bit type: for each
    operation inc[L] += D, inc[R + 1] -= D. Element i of the final array is
    the sum inc[1] + ... + inc[i] (prefix sums in one pass).
    Fast input/output: up to 9 * 10^5 numbers on input, 3 * 10^5 on output.
  known_wrong_approaches:
    - "wa (cpp/java): the difference array and prefix sums in a 32-bit type — an overflow with |D| = 10^9 and a large Q"
    - "re (py): the array inc of size N + 1 instead of N + 2 — inc[R + 1] goes outside the array with R = N"
    - "tl: naive addition in O(R - L + 1) per operation — O(N * Q)"
    - "tl_ok (cpp/java): a recursive segment tree, point addition over the difference array and a prefix sum — O((N + Q) log N)"
    - "tl_ok (cpp/java): a non-recursive bottom-up segment tree, point addition over the difference array and a prefix sum — O((N + Q) log N)"
    - "tl_ok (cpp/java): a Fenwick tree, point addition over the difference array (add(L, D), add(R + 1, -D)) and a prefix sum — O((N + Q) log N)"
    - "tl_ok (cpp/java): a recursive segment tree, lazy range addition and a point query — O((N + Q) log N)"
    - "tl_ok (cpp/java): a non-recursive bottom-up segment tree, lazy range addition and a point query — O((N + Q) log N)"
    - "tl_ok (cpp/java): sqrt decomposition, lazy range addition (whole blocks — a deferred block addition, the edges — element by element) and a point query — O(Q * sqrt(N))"

checker:
  standard: "ncmp"
  custom_needed: false
  custom_comparison_notes: null

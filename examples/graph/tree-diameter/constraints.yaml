problem_id: graph--tree-diameter
intended_complexity: "O(N)"
complexity_reasoning: |
  По массиву предков за O(N) строится список смежности неориентированного
  дерева. Затем два обхода (BFS или нерекурсивный DFS): первый из
  произвольной вершины находит самую удалённую вершину S, второй из S
  находит самую удалённую вершину E; расстояние от S до E и есть диаметр.
  Каждый обход — O(N) рёбер и вершин, итого O(N) времени и памяти.
  Глубина дерева может быть порядка N (бамбук, «ствол пальмы»), поэтому
  обход должен быть итеративным либо требовать увеличенного стека.

variables:
  - name: "N"
    min: 2
    max: 300000
    description: "количество вершин дерева"
    status: proposed
    rationale: |
      max: 300000 взят из спека без изменений.
      min: в constraints.variables спека указано min=1, но в «Формате
      входных данных» условия написано 2 <= N <= 3e5. Валидатор обязан
      проверять ровно те гарантии, которые видит участник, поэтому
      зафиксировано min = 2. Если автор хочет разрешить N = 1 (дерево из
      одной вершины, диаметр 0), нужно поправить условие и это значение.
  - name: "p_i"
    min: 0
    max: "N"
    description: "предок вершины i, либо 0, если i — корень; фактическая верхняя граница каждого p_i равна N"
    status: confirmed

limits:
  time_limit_seconds: 2
  memory_limit_mb: 256
  status: confirmed
  rationale: |
    TL и ML заданы автором явно (2.0 c и 256 Мб) и используются как есть.
    Согласованность: при N = 3e5 эталонное решение O(N) выполняет порядка
    1e6 элементарных операций (чтение массива предков, построение списков
    смежности, два BFS), что на C++ укладывается в ~0.05 c, а на Java —
    в ~0.3 c, то есть заметно меньше 0.5 * 2 c. Память: список смежности
    (2 * (N - 1) чисел), массив предков и массив расстояний — порядка
    десятка Мб при лимите 256 Мб. TL 2 c надёжно отсекает квадратичные
    решения (3e5^2 = 9e10 операций).

validator:
  constants:
    - name: "N"
      cpp_type: int
      min: 2
      max: 300000
    - name: "p_i"
      cpp_type: int
      min: 0
      max: "N"
  checks:
    - "Первая строка: одно число N, затем readEoln()."
    - "Вторая строка: ровно N чисел p_1 ... p_N через один пробел (readInts), каждое в [0, N], затем readEoln() и readEof()."
    - "Ровно одно значение p_i равно 0 — у дерева ровно один корень."
    - "Для всех i: p_i != i — вершина не является своим предком."
    - "Массив предков задаёт дерево: из любой вершины, идя по предкам, попадаем в корень; циклов нет (итеративная покраска вершин по пути до корня либо до уже обработанной вершины)."
    - "Не требуется p_i < i: порядок номеров предков не проверяется (предок может иметь больший номер, чем вершина)."

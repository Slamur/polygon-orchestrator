problem_id: graph--tree-diameter 
title:
  ru: "Диаметр дерева"
  en: "Tree diameter"                
references: []

# ---------------------------------------------------------------------------
# 1. ЧЕРНОВИК УСЛОВИЯ — шаг statement_draft
# ---------------------------------------------------------------------------
statement_draft:
  legend_sketch: |
    Дано корневое дерево из N вершин. 
    Диаметром дерева называется самый длинный простой путь между двумя вершинами (его длина — количество рёбер на пути). 
    Необходимо найти любой диаметр дерева.
  formal_input_sketch: |
    В первой строке одно целое число N (2 <= N <= 3e5) — количество вершин дерева.

    Во второй строке N целых чисел p_1, ..., p_N (0 <= p_i <= N) — массив предков:
      - p_i — номер вершины-предка вершины i
      - p_i = 0, если вершина i является корнем дерева.

    Гарантируется, что    
      - ровно одно из чисел p_i равно 0;
      - массив предков задаёт корректное дерево.
  formal_output_sketch: |
    Выведите три целых числа D, S, E (1 <= D, S, E <= N; S != E) — длина найденного диаметра (количество рёбер на пути), номер начальной и номер конечной вершины этого пути. 
    Расстояние между S и E должно быть равно D, и D должно быть максимальным возможным расстоянием между двумя вершинами дерева.
    Если диаметров несколько, можно вывести любой.
  indexing: "1-indexed"              
  sample_examples:
    - input: |                       
        5
        2 0 1 1 2
      output: |                      
        3 5 4
      note_hint: |
        Рассмотрим структуру заданного дерева:
          - вершина 2 — корень,
          - вершины 1 и 5 — её дети, 
          - вершины 3 и 4 — дети вершины 1.
        
        В дереве есть два диаметра, каждый из которых содержит 3 ребра:
          - 5 - 2 - 1 - 4 
          - 5 - 2 - 1 - 3 

        Порядок вывода вершин не имеет значения, то есть любой из ответов "3 5 4", "3 4 5", "3 5 3", "3 3 5" является корректным.
  preserve_legend_verbatim: true
  references: []

# ---------------------------------------------------------------------------
# 2. ОГРАНИЧЕНИЯ — шаг constraints_pick (+ валидатор)
# ---------------------------------------------------------------------------
constraints:
  intended_complexity: "O(N)"        
  complexity_reasoning: |            
    По массиву предков за O(N) строится список смежности неориентированного
    дерева. Затем два обхода (BFS или нерекурсивный DFS): первый из
    произвольной вершины находит самую удалённую вершину S, второй из S
    находит самую удалённую вершину E; расстояние от S до E и есть диаметр.
    Каждый обход — O(N) рёбер и вершин, итого O(N) времени и памяти.
    Глубина дерева может быть порядка N (бамбук, «ствол пальмы»), поэтому
    обход должен быть итеративным либо требовать увеличенного стека.
  variables:
    - name: "N"
      min: 2
      max: 300000                    
      description: "количество вершин дерева"
    - name: "p_i"
      min: 0
      max: "N"
      description: "предок вершины i, либо 0, если i — корень" 
  special_guarantees:
    - "ровно одно значение p_i равно 0 — у дерева ровно один корень"
    - "p_i != i: вершина не является своим предком"                           
    - "массив предков задаёт дерево: переходя по предкам из любой вершины, попадаем в корень, циклов нет"
    - "не гарантируется p_i < i — предок может иметь больший номер, чем вершина"
  test_groups_hint: []
  test_groups_needed: false
  time_limit_seconds: 2    
  memory_limit_mb: 256
  references: []

# ---------------------------------------------------------------------------
# 3. ГЕНЕРАТОРЫ И TEST-SCRIPT — шаг generators_and_script
# ---------------------------------------------------------------------------
generation:
  generator_ideas:
    - name: "gen_tree_rand"
      params: ["n"]
      purpose: |
        Случайное дерево: генерится перестановка вершин, у каждой вершины
        предок — случайная вершина на префиксе перестановки (первая вершина
        перестановки — корень, её предок 0).
    - name: "gen_palm"
      params: ["n", "h", "k"]
      purpose: |
        «Пальма»: «ствол» — цепочка длины H, её начало — корень R,
        противоположный конец — вершина P. «Листья» — цепочки длины K,
        каждый лист крепится к P; листьями заполняются все оставшиеся
        вершины. Базовый пример пальмы: H = N / 2, K = 1.
    - name: "gen_jungle"
      params: ["n", "h", "k", "palms"]
      purpose: |
        «Джунгли»: несколько пальм, присоединённых к одному корню.
        Количество пальм — параметр palms, так что при palms = 1 генератор
        даёт обычную пальму (автор предполагал, что имеет смысл сделать
        общий генератор пальмы и джунглей с количеством пальм как
        параметром).
    - name: "gen_tree_balanced"
      params: ["n", "k"]
      purpose: |
        Сбалансированное дерево: все пути от корня до листьев имеют длину
        не более K.
    - name: "upd_tree_shuffle"    
      params: []
      purpose: |
        Читает готовый тест и перенумеровывает вершины случайной
        перестановкой, переписывая массив предков (корень перестаёт быть
        вершиной 1, p_i перестаёт быть меньше i).
  specific_test_ideas:
    - "N = 2 (одно ребро)"                                          
    - "все деревья небольшого размера: случайные деревья для каждого N от 1 до 10"  
    - "бамбук (цепочка) при N = N_max — максимальная глубина, ловит рекурсивный обход"  
    - "звезда: все вершины — дети корня (диаметр 2)"                 
    - "базовая пальма при N = N_max: H = N / 2, K = 1"
    - "пальма с длинными листьями: K порядка H, так что диаметр не проходит через корень"  
    - "джунгли: 2 пальмы у общего корня (диаметр проходит через корень)"
    - "джунгли: много пальм (10, 100, sqrt(N)) у общего корня"
    - "сбалансированное дерево при N = N_max с малым K (например, бинарное, K = log N)"
    - "случайные деревья при N = N_max"
    - "все тесты (кроме явно упорядоченных) с перенумерацией вершин случайной перестановкой" 
    - "берутся джунгли (N чуть меньше максимума), к корню (непошафленному) цепляется маленькое случайное дерево, корень выбирается где-то в этом отростке (потребуется доп. upd_ генератор)"
  script_style: "flat"              
  references: []

# ---------------------------------------------------------------------------
# 4. ЧЕРНОВИКИ РЕШЕНИЙ — шаг solutions_draft
# ---------------------------------------------------------------------------
solutions:
  wanted_verdicts: ["ok", "wa", "tl", "tl_ok", "re"]   
  languages: ["cpp", "java", "py"]                     
  algorithm_hint: |                  
    Построить по массиву предков список смежности неориентированного
    дерева (ребро {i, p_i} для всех вершин, кроме корня). Запустить обход
    (BFS) из произвольной вершины, например из вершины 1, и найти самую
    удалённую от неё вершину S. Запустить обход из S, найти самую
    удалённую вершину E и расстояние до неё D. Вывести D, S, E.
    Обход обязательно итеративный (глубина дерева до N).
  alternative_approaches:
    - "динамика по дереву: для каждой вершины v считаем две наибольшие глубины поддеревьев её детей; диаметр — максимум их суммы по всем v, концы восстанавливаются спуском по сохранённым детям-максимумам (порядок обработки вершин — итеративный обход снизу вверх)"  
  known_wrong_approaches:
    - "wa: ответ — наибольшая глубина от корня и соответствующая вершина (один обход из корня) — ломается на пальме с длинными листьями и на джунглях"       
    - "wa: один обход из вершины 1 вместо корня, расстояние считается только до самой далёкой вершины от неё — ломается на случайных и несимметричных деревьях" 
    - "wa: диаметр обязательно проходит через корень" 
    - "wa: D выводится как количество вершин на пути (на единицу больше ответа), концы правильные"  
    - "wa: длина диаметра найдена верно, но концы S и E выводятся от первого обхода (S — старт первого обхода), так что расстояние между ними меньше D" 
    - "tl (cpp): BFS из каждой вершины — O(N^2)"
    - "re (py): рекурсивный DFS — переполнение стека на бамбуке при N = N_max"
    - "tl_ok (java): верный алгоритм с медленным (небуферизованным) вводом-выводом — на вход до 2*10^5 чисел" 
  references: []

# ---------------------------------------------------------------------------
# 5. ЧЕКЕР — шаг checker_draft
# ---------------------------------------------------------------------------
checker:
  standard: null
  custom_needed: true                
  custom_comparison_notes: |         
    Вход: N и массив предков p_1, ..., p_N, задающий дерево (p_i = 0 для
    корня). Чекер восстанавливает дерево по входу.
    Ответ: три целых числа D, S, E в произвольном переносе строк —
    длина диаметра (количество рёбер на пути), начало и конец пути.
    Проверка ответа участника:
      - 1 <= S <= N и 1 <= E <= N, иначе неверный ответ;
      - 0 <= D <= N - 1;
      - расстояние между S и E в дереве (количество рёбер на простом пути)
        должно быть в точности равно D, иначе неверный ответ.
    Сравнение: больший D лучше. Ответ участника считается верным, если его
    D равен D жюри (и согласован с парой (S, E), как выше). Если D
    участника меньше D жюри — неверный ответ. Если D участника строго
    больше D жюри (и при этом согласован с (S, E)) — это ошибка жюри, fail.
    Конкретные S и E с ответом жюри не сравниваются: подходит любая пара
    вершин на расстоянии D, в любом порядке.
  references: []

problem_id: graph--tree-diameter
title:
  ru: "Диаметр дерева"
  en: "Tree diameter"
references: []

# ---------------------------------------------------------------------------
# 1. STATEMENT DRAFT — the statement_draft step
# ---------------------------------------------------------------------------
statement_draft:
  legend_sketch: |
    Given a rooted tree of N vertices.
    A diameter of a tree is the longest simple path between two vertices (its length is the number of edges on the path).
    Find any diameter of the tree.
  formal_input_sketch: |
    The first line has one integer N (2 <= N <= 3e5) — the number of vertices of the tree.

    The second line has N integers p_1, ..., p_N (0 <= p_i <= N) — the array of parents:
      - p_i is the number of the parent vertex of vertex i
      - p_i = 0 if vertex i is the root of the tree.

    It's guaranteed that
      - exactly one of the numbers p_i equals 0;
      - the array of parents defines a correct tree.
  formal_output_sketch: |
    Print three integers D, S, E (1 <= D, S, E <= N; S != E) — the length of the found diameter (the number of edges on the path), the number of the start vertex and the number of the end vertex of this path.
    The distance between S and E must be equal to D, and D must be the maximal possible distance between two vertices of the tree.
    If there are several diameters, any may be printed.
  indexing: "1-indexed"
  sample_examples:
    - input: |
        5
        2 0 1 1 2
      output: |
        3 5 4
      note_hint: |
        Consider the structure of the given tree:
          - vertex 2 is the root,
          - vertices 1 and 5 are its children,
          - vertices 3 and 4 are the children of vertex 1.

        The tree has two diameters, each of which contains 3 edges:
          - 5 - 2 - 1 - 4
          - 5 - 2 - 1 - 3

        The order of printing the vertices doesn't matter, that is, any of the answers "3 5 4", "3 4 5", "3 5 3", "3 3 5" is correct.
  preserve_legend_verbatim: true
  references: []

# ---------------------------------------------------------------------------
# 2. LIMITS — the constraints_pick step (+ the validator)
# ---------------------------------------------------------------------------
constraints:
  intended_complexity: "O(N)"
  complexity_reasoning: |
    From the array of parents an adjacency list of the undirected
    tree is built in O(N). Then two traversals (BFS or a non-recursive DFS): the first one from
    an arbitrary vertex finds the farthest vertex S, the second one from S
    finds the farthest vertex E; the distance from S to E is the diameter.
    Each traversal is O(N) edges and vertices, in total O(N) time and memory.
    The tree's depth may be of the order of N (a bamboo, the "palm trunk"), so
    the traversal must be iterative or require an increased stack.
  variables:
    - name: "N"
      min: 2
      max: 300000
      description: "the number of vertices of the tree"
    - name: "p_i"
      min: 0
      max: "N"
      description: "the parent of vertex i, or 0 if i is the root"
  special_guarantees:
    - "exactly one value p_i equals 0 — the tree has exactly one root"
    - "p_i != i: a vertex isn't its own parent"
    - "the array of parents defines a tree: going by parents from any vertex, we reach the root, there are no cycles"
    - "p_i < i isn't guaranteed — a parent may have a larger number than the vertex"
  test_groups_hint: []
  test_groups_needed: false
  time_limit_seconds: 2
  memory_limit_mb: 256
  references: []

# ---------------------------------------------------------------------------
# 3. GENERATORS AND TEST-SCRIPT — the tests_plan, generators_draft, test_script_draft steps
# ---------------------------------------------------------------------------
generation:
  generator_ideas:
    - name: "gen_tree_rand"
      params: ["n"]
      purpose: |
        A random tree: a permutation of the vertices is generated, each vertex's
        parent is a random vertex on the prefix of the permutation (the first vertex
        of the permutation is the root, its parent is 0).
    - name: "gen_palm"
      params: ["n", "h", "k"]
      purpose: |
        A "palm": the "trunk" is a chain of length H, its start is the root R,
        the opposite end is the vertex P. The "leaves" are chains of length K,
        each leaf is attached to P; all the remaining vertices are filled
        with leaves. A basic palm example: H = N / 2, K = 1.
    - name: "gen_jungle"
      params: ["n", "h", "k", "palms"]
      purpose: |
        A "jungle": several palms attached to one root.
        The number of palms is the palms parameter, so with palms = 1 the generator
        gives an ordinary palm (the author assumed it makes sense to make a
        common generator of a palm and a jungle with the number of palms as a
        parameter).
    - name: "gen_tree_balanced"
      params: ["n", "k"]
      purpose: |
        A balanced tree: all paths from the root to the leaves have length
        at most K.
    - name: "upd_tree_shuffle"
      params: []
      purpose: |
        Reads a ready test and renumbers the vertices by a random
        permutation, rewriting the array of parents (the root stops being
        vertex 1, p_i stops being less than i).
  specific_test_ideas:
    - "N = 2 (one edge)"
    - "all trees of a small size: random trees for each N from 1 to 10"
    - "a bamboo (a chain) with N = N_max — the maximal depth, catches a recursive traversal"
    - "a star: all vertices are children of the root (diameter 2)"
    - "a basic palm with N = N_max: H = N / 2, K = 1"
    - "a palm with long leaves: K of the order of H, so the diameter doesn't go through the root"
    - "a jungle: 2 palms at a common root (the diameter goes through the root)"
    - "a jungle: many palms (10, 100, sqrt(N)) at a common root"
    - "a balanced tree with N = N_max with a small K (e.g. a binary one, K = log N)"
    - "random trees with N = N_max"
    - "all tests (except explicitly ordered ones) with the vertices renumbered by a random permutation"
    - "take a jungle (N slightly less than the maximum), attach a small random tree to the (unshuffled) root, choose the root somewhere in this offshoot (an extra upd_ generator is needed)"
  script_style: "flat"
  references: []

# ---------------------------------------------------------------------------
# 4. SOLUTION DRAFTS — the solution stages solutions_*
# ---------------------------------------------------------------------------
solutions:
  wanted_verdicts: ["ok", "wa", "tl", "tl_ok", "re"]
  languages: ["cpp", "java", "py"]
  algorithm_hint: |
    Build from the array of parents an adjacency list of the undirected
    tree (the edge {i, p_i} for all vertices except the root). Run a traversal
    (BFS) from an arbitrary vertex, e.g. from vertex 1, and find the vertex S
    farthest from it. Run a traversal from S, find the farthest
    vertex E and the distance D to it. Print D, S, E.
    The traversal must be iterative (the tree's depth is up to N).
  alternative_approaches:
    - "DP on the tree: for each vertex v compute the two largest subtree depths of its children; the diameter is the maximum of their sum over all v, the ends are restored by descending along the saved maximal children (the order of processing the vertices — an iterative bottom-up traversal)"
  known_wrong_approaches:
    - "wa: the answer is the largest depth from the root and the corresponding vertex (one traversal from the root) — breaks on a palm with long leaves and on jungles"
    - "wa: one traversal from vertex 1 instead of the root, the distance is computed only to the vertex farthest from it — breaks on random and asymmetric trees"
    - "wa: the diameter necessarily goes through the root"
    - "wa: D is printed as the number of vertices on the path (one more than the answer), the ends are correct"
    - "wa: the diameter's length is found correctly, but the ends S and E are printed from the first traversal (S is the start of the first traversal), so the distance between them is less than D"
    - "tl (cpp): BFS from each vertex — O(N^2)"
    - "re (py): a recursive DFS — a stack overflow on a bamboo with N = N_max"
    - "tl_ok (java): the correct algorithm with slow (unbuffered) input/output — up to 2*10^5 numbers on input"
  references: []

# ---------------------------------------------------------------------------
# 5. CHECKER — the checker_draft step
# ---------------------------------------------------------------------------
checker:
  standard: null
  custom_needed: true
  custom_comparison_notes: |
    Input: N and the array of parents p_1, ..., p_N defining a tree (p_i = 0 for
    the root). The checker restores the tree from the input.
    Answer: three integers D, S, E with arbitrary line breaks —
    the length of the diameter (the number of edges on the path), the start and the end of the path.
    Checking the participant's answer:
      - 1 <= S <= N and 1 <= E <= N, otherwise a wrong answer;
      - 0 <= D <= N - 1;
      - the distance between S and E in the tree (the number of edges on the simple path)
        must be exactly equal to D, otherwise a wrong answer.
    Comparison: a larger D is better. The participant's answer is considered correct if its
    D equals the jury's D (and is consistent with the pair (S, E), as above). If the
    participant's D is less than the jury's D — a wrong answer. If the participant's D is strictly
    greater than the jury's D (and consistent with (S, E)) — it's a jury error, fail.
    The concrete S and E aren't compared with the jury's answer: any pair of
    vertices at distance D fits, in any order.
  references: []

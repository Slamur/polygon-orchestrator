problem_id: graph--tree-diameter

generators:
  - name: gen_tree_rand
    status: confirmed
    params:
      - name: n
        type: int
        description: the number of vertices, n >= 2
    input: null
    output: the whole test — N on the first line, the array of parents p_1..p_N on the second
    algorithm: |
      A random permutation of the vertices 1..n; the first vertex of the permutation is
      the root (parent 0), the parent of each next one is an equiprobable vertex
      from the already placed prefix of the permutation. Fails with n < 2.

  - name: gen_palm
    status: confirmed
    params:
      - name: n
        type: int
        description: the number of vertices, n >= 2
      - name: h
        type: int
        description: the number of trunk vertices, 1 <= h <= n
      - name: k
        type: int
        description: the length of a leaf, k >= 1
    input: null
    output: the whole test — N and the array of parents
    algorithm: |
      The trunk is the chain of vertices 1..h (vertex 1 is the root, the parent of v is v - 1),
      vertex h is the top P. The remaining vertices h+1..n are chain leaves of
      k vertices (the last one may be shorter), each attached to P. The vertices
      are numbered in the order of building. Fails with n < 2, h outside [1, n],
      k < 1.

  - name: gen_jungle
    status: confirmed
    params:
      - name: n
        type: int
        description: the number of vertices, n >= 2
      - name: h
        type: int
        description: the number of trunk vertices of each palm (with the common root), h >= 1
      - name: k
        type: int
        description: the length of a leaf, k >= 1
      - name: palms
        type: int
        description: the number of palms at the common root, palms >= 1
    input: null
    output: the whole test — N and the array of parents
    algorithm: |
      The root is vertex 1. From it go palms trunks of h - 1 new vertices each;
      the end of the j-th trunk is its top. The remaining vertices are chain leaves
      of k vertices (the last one may be shorter), in turn to the tops of
      palms 1, 2, ..., palms, 1, ... The vertices are numbered in the order of
      building. Fails if 1 + palms * (h - 1) > n or the parameters are out of
      the allowed range.

  - name: gen_tree_balanced
    status: confirmed
    params:
      - name: n
        type: int
        description: the number of vertices, n >= 2
      - name: k
        type: int
        description: the largest depth of a vertex, k >= 1
    input: null
    output: the whole test — N and the array of parents
    algorithm: |
      The root is vertex 1 (depth 0). The vertices 2..n in random order
      are hung on an equiprobable vertex among those whose depth is less than
      k — so all paths from the root to the leaves are no longer than k. Fails with n < 2
      or k < 1.

  - name: upd_tree_shuffle
    status: confirmed
    params: []
    input: a ready test — N and the array of parents
    output: the same test with the vertices renumbered by a random permutation
    algorithm: |
      A random permutation newLabel of the vertices 1..N; vertex v becomes
      newLabel[v], its parent — newLabel[p_v] (0 of the root stays 0).

  - name: upd_attach_branch_reroot
    status: proposed
    params:
      - name: k
        type: int
        description: the number of the offshoot's vertices, k >= 1
    input: a ready test — N and the array of parents (with a root — a vertex with parent 0)
    output: a test on N + k vertices — N + k and the array of parents
    algorithm: |
      A random tree of k new vertices N+1..N+k is attached to the root of the input tree
      (the new vertices in random order, the parent of each is
      an equiprobable one of those already placed, starting from the root). The new root is
      an equiprobable vertex of the offshoot; the tree is re-hung on it with
      an iterative BFS (depth up to N), the array of parents is built anew.
      Fails with k < 1 or if the input has no root.
    rationale: |
      The test from specific_test_ideas[11] requires a generator the author didn't
      describe: the root ends up far from the structurally interesting part of
      the tree.

constants:
  - name: minN
    value: "2"
    description: N.min from constraints.yaml
  - name: maxN
    value: 3 * 10^5
    description: N.max from constraints.yaml
  - name: smallMaxN
    value: "10"
    description: the bound of small tests
  - name: starH
    value: "1"
    description: a star — a palm with a trunk of only the root
  - name: starK
    value: "1"
    description: a star — leaves of one vertex
  - name: palmBaseH
    value: maxN / 2
    description: the basic palm from specific_test_ideas
  - name: palmBaseK
    value: "1"
    description: the basic palm from specific_test_ideas
  - name: palmLongLeavesH
    value: maxN / 2
    description: a palm with long leaves
  - name: palmLongLeavesK
    value: palmLongLeavesH
    description: a leaf length of the order of the trunk
  - name: jungleFewPalmsH
    value: maxN / 10
    description: a jungle of two palms
  - name: jungleFewPalmsK
    value: "1"
    description: a jungle of two palms
  - name: jungleFewPalmsCount
    value: "2"
    description: a jungle of two palms
  - name: jungleManyPalmsH
    value: "10"
    description: a jungle of many palms
  - name: jungleManyPalmsK
    value: "1"
    description: a jungle of many palms
  - name: jungleManyPalmsCounts
    value: "[10, 100, isqrt(maxN)]"
    description: the number of palms — 10, 100, sqrt(N) from specific_test_ideas
  - name: balancedK
    value: log2ceil(maxN)
    description: a binary-like tree, K = log N
  - name: attachBranchK
    value: smallMaxN
    description: the offshoot's size
  - name: attachJungleN
    value: maxN - attachBranchK
    description: a jungle slightly less than the maximum, so that with the offshoot it's no more than maxN
  - name: attachJungleH
    value: attachJungleN / 10
    description: a jungle for the offshoot
  - name: attachJungleK
    value: "1"
    description: a jungle for the offshoot
  - name: attachJunglePalms
    value: jungleFewPalmsCount
    description: a jungle for the offshoot

tests:
  - description: Small random trees, N = minN..smallMaxN
    status: confirmed
    covers:
      - specific_test_ideas[0]
      - specific_test_ideas[1]
      - known_wrong_approaches[1]
      - known_wrong_approaches[4]
    commands:
      - gen_tree_rand -n=n
    repeat: n = minN..smallMaxN

  - description: A bamboo with N = maxN — the largest depth, catches a recursive traversal
    status: confirmed
    covers:
      - specific_test_ideas[2]
      - specific_test_ideas[10]
      - known_wrong_approaches[6]
    commands:
      - gen_palm -n=maxN -h=maxN -k=1
      - gen_palm -n=maxN -h=maxN -k=1 | upd_tree_shuffle
    repeat: null

  - description: A star with N = maxN — all vertices are children of the root, diameter 2
    status: confirmed
    covers:
      - specific_test_ideas[3]
      - specific_test_ideas[10]
    commands:
      - gen_palm -n=maxN -h=starH -k=starK
      - gen_palm -n=maxN -h=starH -k=starK | upd_tree_shuffle
    repeat: null

  - description: The basic palm with N = maxN, H = N / 2, K = 1
    status: confirmed
    covers:
      - specific_test_ideas[4]
      - specific_test_ideas[10]
      - known_wrong_approaches[3]
      - known_wrong_approaches[5]
      - known_wrong_approaches[7]
    commands:
      - gen_palm -n=maxN -h=palmBaseH -k=palmBaseK
      - gen_palm -n=maxN -h=palmBaseH -k=palmBaseK | upd_tree_shuffle
    repeat: null

  - description: A palm with long leaves — the diameter doesn't go through the root
    status: confirmed
    covers:
      - specific_test_ideas[5]
      - specific_test_ideas[10]
      - known_wrong_approaches[0]
      - known_wrong_approaches[2]
    commands:
      - gen_palm -n=maxN -h=palmLongLeavesH -k=palmLongLeavesK
      - gen_palm -n=maxN -h=palmLongLeavesH -k=palmLongLeavesK | upd_tree_shuffle
    repeat: null

  - description: A jungle of two palms at a common root — the diameter goes through the root
    status: confirmed
    covers:
      - specific_test_ideas[6]
      - specific_test_ideas[10]
      - known_wrong_approaches[0]
    commands:
      - gen_jungle -n=maxN -h=jungleFewPalmsH -k=jungleFewPalmsK -palms=jungleFewPalmsCount
      - gen_jungle -n=maxN -h=jungleFewPalmsH -k=jungleFewPalmsK -palms=jungleFewPalmsCount | upd_tree_shuffle
    repeat: null

  - description: A jungle of many palms (10, 100, sqrt(N)) at a common root
    status: confirmed
    covers:
      - specific_test_ideas[7]
      - specific_test_ideas[10]
    commands:
      - gen_jungle -n=maxN -h=jungleManyPalmsH -k=jungleManyPalmsK -palms=palmsCount
      - gen_jungle -n=maxN -h=jungleManyPalmsH -k=jungleManyPalmsK -palms=palmsCount | upd_tree_shuffle
    repeat: palmsCount over jungleManyPalmsCounts

  - description: A balanced tree with N = maxN, K = ceil(log2(N))
    status: confirmed
    covers:
      - specific_test_ideas[8]
      - specific_test_ideas[10]
    commands:
      - gen_tree_balanced -n=maxN -k=balancedK
      - gen_tree_balanced -n=maxN -k=balancedK | upd_tree_shuffle
    repeat: null

  - description: A random tree with N = maxN (already with random numbering)
    status: confirmed
    covers:
      - specific_test_ideas[9]
      - known_wrong_approaches[1]
      - known_wrong_approaches[4]
      - known_wrong_approaches[5]
    commands:
      - gen_tree_rand -n=maxN
    repeat: null

  - description: A jungle with a small offshoot at the root, the new root is inside the offshoot
    status: proposed
    covers:
      - specific_test_ideas[11]
    commands:
      - gen_jungle -n=attachJungleN -h=attachJungleH -k=attachJungleK -palms=attachJunglePalms | upd_attach_branch_reroot -k=attachBranchK
    repeat: null
    rationale: |
      The jungle's N is reduced by the offshoot's size, so that the final test doesn't
      exceed maxN.

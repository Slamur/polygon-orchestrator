# The format of tests_design.yaml — the result of the tests_plan step. The orchestrator builds
# the test plan tests_plan.yaml from it: the generators as they are, and for each idea entry
# and each of its test groups — a block of the test-script with the formulas computed for
# that group (every formula becomes a named value of the plan). From the plan the next steps
# write the generators and the test-script; they don't see the problem's spec, so everything
# needed for the implementation must be here. The top-level structure is mandatory; the
# values below are placeholders <in angle brackets>, not a sample of the content.
#
# Each decision is marked with status:
#   confirmed  — set by the author in the spec (a generator from generation.generator_ideas,
#                a test from generation.specific_test_ideas on the author's generators);
#   proposed   — invented by the model at the author's order (an implementation of
#                specific_test_ideas for which the author has no generator, the choice of
#                parameters and groups) — with a justification in rationale;
#   suggestion — the model's own idea beyond what the author ordered — with a justification
#                in rationale.
problem_id: <problem_id from the spec>

generators:                     # an entry for each generator of the problem, without repeated names
  - name: "<gen_* | upd_*>"     # the file name without .cpp: gen_* produces the input or its beginning,
                                # upd_* reads a ready test from stdin and transforms it
    status: <confirmed | proposed | suggestion>
    params:                     # command-line parameters (opt<T>("name")); none — []
      - name: "<parameter name>"
        type: <int | ll | string>   # no bool: a flag is an int 0/1 (-name=1)
        description: "<meaning and allowed values>"
    input: "<what it reads from standard input (the part of the test from the previous generator of the chain) | null>"
    output: "<what it prints: the whole test or a part of it, in the problem's input format>"
    algorithm: |
      <how the test is built — detailed enough to implement the generator
      without the spec: random choices, how the test's correctness is guaranteed
      (all limits and special_guarantees), with which parameters the generator
      fails via ensuref>
    rationale: |                # only with status: proposed | suggestion
      <which case it is needed for>

constants:                      # [optional] your own named values that aren't a limit of a variable
  - name: "<name, e.g. percentHalf>"   # (a share, a mode, a list for a loop); the limits are formulas, see below
    value: "<a number, a list or an expression over other constants>"
    description: "<what it is and why such a value>"

ideas:                          # the tests, in generation order within each group (tests.md,
                                # "The standard order of tests")
  - id: "<specific_test_ideas[<number from 0>] | own[<number from 0>]>"
                                # an author's scenario, or your own idea (C) numbered in your list;
                                # one idea may take several entries — on disjoint groups, e.g. when
                                # a group's special_property needs another generator
    status: <confirmed | proposed | suggestion>
    what: "<what the tests check — the description line in the script>"
    groups: <all | ["<group name>", ...]>   # only if constraints.yaml has test_groups (then
                                # mandatory): all its groups, or a list; never group 0 — the
                                # statement examples. The tests repeat in each group with that
                                # group's values of the formulas
    tests:                      # a template per test: a chain of generators joined with |,
                                # parameters -name=value; the value is a number, a name from
                                # constants or a formula in braces
      - "<gen_x -n={n.max} -k=1 | upd_y>"
      - "<gen_x -n={n.max / 2} -minA={a.lo}>"
    repeat: "<if the entry is a loop: over which values, e.g. n = {n.min}..{n.max} | null>"
                                # never in a group with points_policy each_test: the number of its
                                # tests must be known and divide its points
    rationale: |                # only with status: proposed | suggestion
      <why such tests, parameters and groups>

# Formulas — integer arithmetic (+ - * / and brackets) over numbers and the limits of the
# variables of constraints.yaml, computed for each group of the entry:
#   {<variable>.max}, {<variable>.min} — the variable's bound in the group: the group's own
#                       (test_groups[].variables), otherwise the problem's;
#   {<variable>.lo}   — the first value of the group's own range: one more than the largest
#                       value of the variable in the groups it depends on (dependencies,
#                       transitively); without such groups — {<variable>.min}. A group whose
#                       dependencies already take the variable up to its max has no such
#                       value: its own range is in another variable or its special_property.
# Without test groups the formulas give the problem's limits.

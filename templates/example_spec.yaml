# Спек учебной задачи, для которой написаны все шаблоны в templates/
# (validator.cpp, checker.cpp, generators/*, test_script, solutions/*).
# Прикладывается к вызовам модели вместе с шаблонами как пара
# "вот спек задачи -> вот что по нему ожидалось". В specs/ не лежит
# намеренно: это не задача для генерации, `llm generate --all` её не видит.
problem_id: example_spec               # совпадает с именем файла, как у обычных спеков
title:
  ru: "Префикс с большой суммой"
  en: "Prefix with a large sum"

statement_draft:
  legend_sketch: |
    Дан массив неотрицательных целых чисел и число K. Нужно найти самый
    короткий префикс массива, сумма элементов которого строго больше K.
  formal_input_sketch: |
    В первой строке два целых числа N и K — длина массива и порог.
    Во второй строке N целых чисел A_1, ..., A_N — элементы массива.
  formal_output_sketch: |
    Если существует индекс i, для которого A_1 + ... + A_i > K, в первой
    строке вывести "YES", во второй — минимальный такой i.
    Если такого индекса нет, вывести единственную строку "NO".
    Ответ определён однозначно.
  indexing: "1-indexed"
  sample_examples:
    - input: |
        5 6
        1 2 3 4 5
      output: |
        YES
        4
      note_hint: "Сумма первых трёх элементов равна K, а не больше K — поэтому ответ 4, а не 3"
    - input: |
        3 10
        1 2 3
      output: |
        NO
      note_hint: "Сумма всего массива не превосходит K"

constraints:
  intended_complexity: "O(N)"
  complexity_reasoning: |
    Один проход по массиву с накоплением префиксной суммы; ответ — первый
    индекс, на котором сумма стала строго больше K.
  variables:
    - name: "N"
      min: 1
      max: 200000
      description: "длина массива"
    - name: "K"
      min: 0
      max: 1000000000000000
      description: "порог для суммы префикса"
    - name: "A_i"
      min: 0
      max: 1000000000
      description: "элемент массива"
  time_limit_seconds: 1
  memory_limit_mb: 256

generation:
  generator_ideas:
    - name: "gen_array_rand"
      params: ["n", "minA", "maxA"]
      purpose: "случайный массив: печатает N и массив, K допишет следующий генератор в цепочке"
    - name: "gen_array_distinct"
      params: ["n", "minA", "maxA"]
      purpose: "случайный массив из попарно различных значений"
    - name: "gen_k_rand"
      params: ["minK", "maxK"]
      purpose: "читает N и массив со стандартного ввода, дописывает случайное K из диапазона"
    - name: "gen_k_too_large"
      params: ["maxK"]
      purpose: "читает N и массив, выбирает K не меньше суммы всего массива — ответ NO"
    - name: "gen_k_eq_pref"
      params: ["minK", "maxK", "delta"]
      purpose: "читает N и массив, выбирает K = (сумма случайного префикса) + delta, приводя к [minK, maxK]"
    - name: "upd_array_sort"
      params: ["desc"]
      purpose: "читает готовый тест и сортирует массив по возрастанию (с флагом desc — по убыванию)"
  specific_test_ideas:
    - "все N от 1 до 10 с маленькими значениями A_i и K"
    - "N = N_max, все A_i = A_max"
    - "N = N_max, K = K_max"
    - "K равно сумме некоторого префикса, а также на 1 меньше и на 1 больше"
    - "ответ NO: K не меньше суммы всего массива"
  reuse_existing_generators: true
  script_style: "flat"

solutions:
  wanted_verdicts: ["ok", "wa", "tl"]
  languages: ["cpp", "java", "py"]
  algorithm_hint: |
    Посчитать префиксные суммы в 64-битном типе и найти первый индекс, на
    котором сумма строго больше K. Если такого нет — ответ NO.
  known_wrong_approaches:
    - "префиксные суммы в 32-битном типе — переполнение при больших A_i"
    - "нестрогое сравнение суммы префикса с K (>= вместо >)"
    - "O(N^2): сумма каждого префикса пересчитывается заново"
    - "верный алгоритм с небуферизованным вводом-выводом"

checker:
  standard: null
  custom_needed: true
  custom_comparison_notes: |
    Вход: N, K и массив A из N чисел.
    Ответ: первый токен — "YES" или "NO", строго в верхнем регистре.
    После "NO" больше ничего быть не должно. После "YES" идёт одно целое
    число i от 1 до N.
    Проверка ответа: сумма A_1 + ... + A_i должна быть строго больше K,
    иначе ответ неверен.
    Сравнение: меньший индекс лучше; "NO" хуже любого индекса. Ответ
    участника должен быть не хуже ответа жюри; если он строго лучше —
    это ошибка жюри (fail).

meta:
  requirements_docs:
    - "templates/tutorials/requirements.md"
    - "templates/tutorials/polygon.md"
    - "templates/tutorials/freemarker.md"
  status: "reviewed"

problem_id: example--array--subsegment-queries-increase-offline
intended_complexity: "O(N + Q)"
complexity_reasoning: |
  Разностный массив: для каждой операции inc[L] += D, inc[R + 1] -= D
  (массив inc размера N + 2), затем ответ — префиксные суммы inc.
  Значения по модулю достигают Q * max|D| = 3 * 10^14 — нужен 64-битный тип.

variables:
  - name: "N"
    min: 1
    max: 300000
    description: "длина массива"
    status: confirmed
  - name: "Q"
    min: 1
    max: 300000
    description: "количество операций"
    status: confirmed
  - name: "L_i"
    min: 1
    max: R_i
    description: "левая граница отрезка i-й операции"
    status: confirmed
  - name: "R_i"
    min: L_i
    max: N
    description: "правая граница отрезка i-й операции"
    status: confirmed
  - name: "D_i"
    min: -1000000000
    max: 1000000000
    description: "прибавляемое число i-й операции"
    status: confirmed

limits:
  time_limit_seconds: 2
  memory_limit_mb: 256
  status: confirmed
  rationale: |
    Заданы автором явно (2.0 с — целое число секунд, 256 Мб). Согласованность
    с O(N + Q): при N = Q = 3 * 10^5 это ~6 * 10^5 операций над разностным
    массивом плюс чтение 9 * 10^5 чисел и вывод 3 * 10^5 — основная
    стоимость именно во вводе-выводе, что с запасом укладывается в 2
    секунды на C++/Java. По памяти: массив из N + 2 значений типа
    long long — около 2.4 Мб, что помещается в 256 Мб. Наивное решение
    за O(N * Q) (до 9 * 10^10 операций) в 2 секунды не укладывается с
    большим запасом.

# test_groups отсутствует: в спеке test_groups_needed: false и
# test_groups_hint пуст — группы автору не нужны.

validator:
  constants:
    - name: "N"
      cpp_type: int
      min: 1
      max: 300000
    - name: "Q"
      cpp_type: int
      min: 1
      max: 300000
    - name: "L_i"
      cpp_type: int
      min: 1
      max: N
    - name: "R_i"
      cpp_type: int
      min: L_i
      max: N
    - name: "D_i"
      cpp_type: int
      min: -1000000000
      max: 1000000000
  checks:
    - "первая строка: N, один пробел, Q, конец строки"
    - "вторая строка: L_1, ..., L_Q через один пробел, конец строки; каждое L_i читается в границах [1, N]"
    - "третья строка: R_1, ..., R_Q через один пробел, конец строки; каждое R_i читается в границах [L_i, N]; тем самым проверяется 1 <= L_i <= R_i <= N"
    - "четвёртая строка: D_1, ..., D_Q через один пробел, конец строки; каждое D_i читается в границах [-10^9, 10^9]; тем самым проверяется |D_i| <= 10^9"
    - "после четвёртой строки — конец файла"

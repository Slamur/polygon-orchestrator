problem_id: number--roots
title:
  ru: "Целые корни"
  en: "Integer roots"
references:
  - "templates/examples/array--prefix-sums"

statement_draft:
  legend_sketch: |
    Дано натуральное число N. Нужно найти целую часть (округление вниз)
    его кубического корня и целую часть его квадратного корня.
  formal_input_sketch: |
    В единственной строке одно целое число N (1 <= N <= 10^18).
  formal_output_sketch: |
    В одной строке через пробел два целых числа: сначала floor(N^(1/3)) —
    наибольшее целое C, для которого C^3 <= N, затем floor(sqrt(N)) —
    наибольшее целое S, для которого S^2 <= N.
    Ответ всегда существует и единственен.
  indexing: "irrelevant"
  sample_examples:
    - input: |
        27
      output: |
        3 5
      note_hint: |
        3^3 = 27 <= 27 < 64 = 4^3, поэтому кубический корень равен 3.
        5^2 = 25 <= 27 < 36 = 6^2, поэтому квадратный корень, округлённый вниз, равен 5.
    - input: |
        63
      output: |
        3 7
      note_hint: |
        3^3 = 27 <= 63 < 64 = 4^3; 7^2 = 49 <= 63 < 64 = 8^2.
        Число на единицу меньше точной степени: оба корня округляются вниз.

constraints:
  intended_complexity: "O(log N)"
  complexity_reasoning: |
    Каждый корень ищется бинпоиском по ответу: для квадратного — на
    [0, 10^9], для кубического — на [0, 10^6]; проверка mid^k <= N
    выполняется без переполнения 64-битного типа (границы бинпоиска
    выбраны так, что mid^k <= 10^18, либо сравнение делается через
    деление). Альтернатива — вещественный корень (sqrtl/cbrtl) с
    целочисленной корректировкой результата на +-1 в обе стороны.
  variables:
    - name: "N"
      min: 1
      max: 1000000000000000000
      description: "число, из которого извлекаются корни"
  test_groups_needed: false
  time_limit_seconds: 1
  memory_limit_mb: 256

generation:
  generator_ideas:
    - name: "gen_n_rand"
      params: ["minN", "maxN"]
      purpose: "случайное N из диапазона [minN, maxN]"
    - name: "gen_n_power"
      params: ["k", "minB", "maxB", "delta"]
      purpose: |
        N = B^k + delta для случайного B из [minB, maxB]; maxB по умолчанию —
        наибольшее B, для которого B^k <= 10^18. Результат должен лежать в
        [1, 10^18] (иначе генератор выбирает другое B или падает с ошибкой).
        Обязательно используется с k = 2, 3, 6; также с k = 4, 5, 12 и
        delta из {-1, 0, +1}.
    - name: "gen_n_pow_of_base"
      params: ["b", "p", "delta"]
      purpose: "N = b^p + delta для фиксированного основания (степени двойки, десятки и т.п.)"
  specific_test_ideas:
    - "все N от 1 до 30"
    - "N = 10^18 (это одновременно 10^6 в кубе и 10^9 в квадрате)"
    - "N = 10^18 - 1"
    - "точные квадраты B^2 и B^2 - 1, B^2 + 1 для больших B (близких к 10^9)"
    - "точные кубы B^3 и B^3 - 1, B^3 + 1 для больших B (близких к 10^6)"
    - "шестые степени B^6 (оба корня целые) и B^6 +- 1, включая максимальное B = 1000"
    - "степени двойки 2^p и 2^p - 1 для p до 59"
    - "степени десятки 10^p и 10^p - 1"
    - "случайные N во всём диапазоне"
  script_style: "flat"

solutions:
  wanted_verdicts: ["ok", "wa", "tl_ok"]
  languages: ["cpp", "java", "py"]
  algorithm_hint: |
    Два независимых бинпоиска по ответу: наибольшее C с C^3 <= N
    (C в [0, 10^6]) и наибольшее S с S^2 <= N (S в [0, 10^9]). Вычисления
    в 64-битном знаковом типе (в Python — целочисленная арифметика);
    границы бинпоиска такие, что mid^k не переполняется.
  alternative_approaches:
    - "вещественный корень (sqrtl/cbrtl в C++, Math.sqrt/Math.cbrt в Java, math.sqrt и ** (1 / 3) в Python) с целочисленной корректировкой результата на +-1 в обе стороны, пока C^3 / S^2 не станут верными"
    - "(py): квадратный корень через math.isqrt, кубический — тем же бинпоиском"
  known_wrong_approaches:
    - "wa (cpp): (long long)sqrt((double)N) без корректировки — ошибка на B^2 - 1 для больших B (double не различает соседние числа около 10^18)"
    - "wa (cpp): (long long)cbrt((double)N) без корректировки — ошибка на B^3 - 1 для больших B"
    - "wa (cpp): кубический корень как pow(N, 1.0 / 3) без корректировки — ошибка уже на точных кубах (например, 64 -> 3)"
    - "wa (py): int(N ** 0.5) без корректировки — ошибка на B^2 - 1 для больших B"
    - "wa (py): int(N ** (1 / 3)) без корректировки — ошибка уже на точных кубах (например, 64 -> 3)"
    - "wa: бинпоиск кубического корня на [0, N] с mid * mid * mid в 64-битном типе — переполнение при N больше ~4 * 10^6, на примерах и маленьких N ответ верный"
    - "wa: бинпоиск квадратного корня со строгим mid * mid < N вместо <= — ошибка на точных квадратах"
    - "tl_ok: линейный перебор квадратного корня S = 0, 1, 2, ... пока (S + 1)^2 <= N — до 10^9 итераций, пограничный случай: на C++ при N = 10^18 около 0.3 с, на Python заведомо TL"

checker:
  standard: "ncmp"
  custom_needed: false
  custom_comparison_notes: null

meta:
  requirements_docs:
    - "templates/common/tutorials/requirements.md"
    - "templates/common/tutorials/polygon.md"
    - "templates/common/tutorials/freemarker.md"
  status: "ready_for_generation"

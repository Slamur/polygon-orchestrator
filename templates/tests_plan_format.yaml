# The format of tests_plan.yaml — the result of the tests_plan step. From it the
# generators_draft step writes the generators (per generators entry — the file
# generators/<name>.cpp), and the test_script_draft step — the test-script (from the
# constants and tests entries). Neither of them sees the problem's spec: everything needed
# for the implementation must be in the plan. The top-level structure is mandatory;
# the values below are placeholders <in angle brackets>, not a sample of the content.
#
# Each decision is marked with status:
#   confirmed  — set by the author in the spec (a generator from generation.generator_ideas,
#                a test from generation.specific_test_ideas on the author's generators);
#   proposed   — invented by the model at the author's order (a test or a generator for
#                known_wrong_approaches, an implementation of specific_test_ideas for
#                which the author has no generator, the choice of parameters) —
#                with a justification in rationale;
#   suggestion — the model's own idea beyond what the author ordered — with a justification
#                in rationale.
problem_id: <problem_id from the spec>

generators:                     # an entry for each generator of the problem, without repeated names
  - name: "<gen_* | upd_*>"     # the file name without .cpp: gen_* produces the input or its beginning,
                                # upd_* reads a ready test from stdin and transforms it
    status: <confirmed | proposed | suggestion>
    params:                     # command-line parameters (opt<T>("name")); none — []
      - name: "<parameter name>"
        type: <int | ll | bool | string>
        description: "<meaning and allowed values>"
    input: "<what it reads from standard input (the part of the test from the previous generator of the chain) | null>"
    output: "<what it prints: the whole test or a part of it, in the problem's input format>"
    algorithm: |
      <how the test is built — detailed enough to implement the generator
      without the spec: random choices, how the test's correctness is guaranteed
      (all limits and special_guarantees), with which parameters the generator
      fails via ensuref>
    rationale: |                # only with status: proposed | suggestion
      <which mistake or case it catches and why the test fails on it>

constants:                      # named values for the commands in tests (in the script — <#assign>)
  - name: "<name, e.g. maxN>"
    value: "<a number or an expression over other constants, e.g. 3 * 10^5 or maxN / 2>"
    description: "<where the value comes from: a variable's bound from constraints.yaml, the model's choice, ...>"

tests:                          # the script's blocks in generation order (tests.md, "The standard order of tests")
  - description: "<what the block checks — the description line in the script>"
    group: "<a group name from the test_groups of constraints.yaml>"   # only if constraints.yaml has test_groups
    status: <confirmed | proposed | suggestion>
    covers:                     # which spec items the block implements; none — [].
                                # As a list, a line per item, as here: [a[0]] on one line isn't YAML
      - "<specific_test_ideas[<number from 0>] | known_wrong_approaches[<number from 0>]>"
    commands:                   # a line per test: a chain of generators joined with |,
                                # the parameter values — numbers or names from constants
      - "<gen_x -n=maxN -k=1 | upd_y>"
    repeat: "<if the block is a loop: over which values, e.g. n = minN..smallMaxN | null>"
    rationale: |                # only with status: proposed | suggestion
      <why such tests and parameters>
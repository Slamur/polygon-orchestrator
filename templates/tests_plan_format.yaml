# Формат tests_plan.yaml — результата шага tests_plan. По нему шаг
# generators_draft пишет генераторы (по записи generators — файл
# generators/<name>.cpp), а шаг test_script_draft — test-script (по записям
# constants и tests). Ни один из них не видит спека задачи: всё, что нужно
# для реализации, должно быть в плане. Структура верхнего уровня обязательна;
# значения ниже — заглушки <в угловых скобках>, а не образец содержания.
#
# Каждое решение помечается status:
#   confirmed  — задано автором в спеке (генератор из generation.generator_ideas,
#                тест из generation.specific_test_ideas на генераторах автора);
#   proposed   — придумано моделью по заказу автора (тест или генератор под
#                known_wrong_approaches, реализация specific_test_ideas, для
#                которой у автора нет генератора, выбор параметров) —
#                с обоснованием в rationale;
#   suggestion — своя идея модели сверх заказанного автором — с обоснованием
#                в rationale.
problem_id: <problem_id из спека>

generators:                     # по записи на каждый генератор задачи, без повторов name
  - name: "<gen_* | upd_*>"     # имя файла без .cpp: gen_* порождает вход или его начало,
                                # upd_* читает готовый тест со stdin и преобразует его
    status: <confirmed | proposed | suggestion>
    params:                     # параметры командной строки (opt<T>("name")); нет — []
      - name: "<имя параметра>"
        type: <int | ll | bool | string>
        description: "<смысл и допустимые значения>"
    input: "<что читает со стандартного ввода (часть теста от предыдущего генератора цепочки) | null>"
    output: "<что печатает: весь тест или его часть, в формате ввода задачи>"
    algorithm: |
      <как строится тест — достаточно подробно, чтобы реализовать генератор
      без спека: случайные выборы, как гарантируется корректность теста
      (все ограничения и special_guarantees), при каких параметрах генератор
      падает через ensuref>
    rationale: |                # только при status: proposed | suggestion
      <какую ошибку или случай ловит и почему тест на этом проваливается>

constants:                      # именованные значения для команд в tests (в скрипте — <#assign>)
  - name: "<имя, например maxN>"
    value: "<число или выражение над другими constants, например 3 * 10^5 или maxN / 2>"
    description: "<откуда значение: граница переменной из constraints.yaml, выбор модели, ...>"

tests:                          # блоки скрипта в порядке генерации (tests.md, "Стандартный порядок тестов")
  - description: "<что проверяет блок — строка description в скрипте>"
    group: "<имя группы из test_groups constraints.yaml>"   # только если в constraints.yaml есть test_groups
    status: <confirmed | proposed | suggestion>
    covers:                     # какие пункты спека блок реализует; нет таких — [].
                                # Списком по строке, как здесь: [a[0]] в одну строку — не YAML
      - "<specific_test_ideas[<номер с 0>] | known_wrong_approaches[<номер с 0>]>"
    commands:                   # по строке на тест: цепочка генераторов через |,
                                # значения параметров — числа или имена из constants
      - "<gen_x -n=maxN -k=1 | upd_y>"
    repeat: "<если блок — цикл: по каким значениям, например n = minN..smallMaxN | null>"
    rationale: |                # только при status: proposed | suggestion
      <почему такие тесты и параметры>

# The format of constraints.yaml — the result of the constraints_pick step. The file is read by
# the following steps (tests_plan and the steps after it) and the orchestrator
# (polygon push takes the TL/ML from limits), so the top-level structure
# is mandatory and the same for all problems. The values below are placeholders
# <in angle brackets>, not a sample of the content.
#
# Each decision is marked status: confirmed (the value is set by the author in the
# spec) or status: proposed (the value is proposed by the model — then with a
# justification in rationale and an entry in the model's response notes).
problem_id: <problem_id from the spec>
intended_complexity: "<constraints.intended_complexity from the spec, as is>"
complexity_reasoning: |
  <constraints.complexity_reasoning from the spec, as is>

variables:                      # an entry for each variable from the spec's constraints.variables
  - name: "<name>"
    min: <number>
    max: <number>
    description: "<description>"
    status: <confirmed | proposed>
    rationale: |                # only with status: proposed
      <why this value was chosen>

limits:
  time_limit_seconds: <a whole number of seconds (or +0.5)>
  memory_limit_mb: <a number, a multiple of 256 (or 32/64/128 if there are grounds)>
  status: <confirmed | proposed>
  rationale: |
    <the consistency of TL/ML with intended_complexity at the maximal values>

test_groups:                    # only if groups are needed; otherwise there's no key at all
  - name: "<group name>"        # the fields — as in the spec's constraints.test_groups_hint
    subset_of: "<group name | null>"
    max_n: <number | null>
    special_property: "<the special property of the group's tests | null>"
    status: <confirmed | proposed>

validator:                      # validator.cpp implements this section 1-to-1
  constants:                    # an entry for each variable from variables
    - name: "<name>"
      cpp_type: <int | ll>
      min: <number>
      max: <number>
  checks:                       # everything the validator checks beyond min/max
    - "<the reading order of tokens and lines, by formal_input_sketch>"
    - "<a check for each special_guarantees>"